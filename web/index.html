<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KG // CONSOLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<style>
  :root{
    --bg:#0a0c0a; --panel:#101410; --panel2:#0d100d; --line:#1f261f;
    --ink:#dfe6da; --dim:#7f8a78; --faint:#525a4e;
    --accent:#c4f24a; --accent-dim:#7d9430; --warn:#ff5468; --warn-bg:#2a1216;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --sans:'IBM Plex Sans JP','IBM Plex Mono',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:46px 46px;background-position:-1px -1px;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 20% 0%,rgba(196,242,74,.05),transparent 55%);}
  .app{display:grid;grid-template-columns:188px 1fr;grid-template-rows:58px 1fr;height:100vh}
  header{grid-column:1/3;display:flex;align-items:center;gap:22px;padding:0 22px;
    border-bottom:1px solid var(--line);background:var(--panel2)}
  .brand{font-family:var(--mono);font-weight:600;letter-spacing:.16em;font-size:15px}
  .brand b{color:var(--accent)}
  .tag{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.22em;text-transform:uppercase}
  .chips{margin-left:auto;display:flex;gap:10px}
  .chip{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:5px 11px;
    color:var(--dim);display:flex;gap:7px;align-items:center}
  .chip b{color:var(--ink);font-weight:600}
  .chip.warn{border-color:var(--warn);color:var(--warn)}
  .chip.warn b{color:var(--warn)}
  nav{border-right:1px solid var(--line);background:var(--panel2);padding:18px 0}
  nav a{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--dim);padding:11px 22px;cursor:pointer;
    border-left:2px solid transparent}
  nav a:hover{color:var(--ink);background:var(--panel)}
  nav a.on{color:var(--accent);border-left-color:var(--accent);background:var(--panel)}
  nav .sep{height:1px;background:var(--line);margin:14px 22px}
  main{overflow:auto;padding:26px 30px}
  .view{display:none;animation:in .4s ease both}
  .view.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h2{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--accent);margin-bottom:16px;
    border-bottom:1px solid var(--line);padding-bottom:10px}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);margin-bottom:26px}
  .kpi{background:var(--panel);padding:18px 20px}
  .kpi .n{font-family:var(--mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;
    letter-spacing:-.01em;line-height:1}
  .kpi.warn .n{color:var(--warn)}
  .kpi .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--faint);margin-top:9px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .box{border:1px solid var(--line);background:var(--panel)}
  .box h3{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);padding:13px 16px;border-bottom:1px solid var(--line)}
  .box .body{padding:14px 16px}
  .bar{display:flex;align-items:center;gap:12px;margin:9px 0;font-family:var(--mono);font-size:12px}
  .bar .name{width:96px;color:var(--dim);text-transform:uppercase;font-size:11px;letter-spacing:.08em}
  .bar .track{flex:1;height:8px;background:var(--panel2);border:1px solid var(--line)}
  .bar .fill{height:100%;background:var(--accent-dim)}
  .bar .v{width:34px;text-align:right;font-variant-numeric:tabular-nums}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:12px;color:var(--dim)}
  .row:last-child{border:0}
  .row b{color:var(--ink);font-weight:500}
  .ent-layout{display:grid;grid-template-columns:320px 1fr;gap:22px}
  .toolbar{display:flex;gap:8px;margin-bottom:14px}
  input[type=text],textarea{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:13px;padding:10px 12px;width:100%;outline:none}
  input[type=text]:focus,textarea:focus{border-color:var(--accent-dim)}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .f{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:4px 10px;
    color:var(--dim);cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
  .f.on{border-color:var(--accent);color:var(--accent)}
  .list{border:1px solid var(--line);max-height:64vh;overflow:auto}
  .item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;
    display:flex;justify-content:space-between;gap:10px}
  .item:hover{background:var(--panel)}
  .item.on{background:var(--panel);border-left:2px solid var(--accent)}
  .item .nm{font-size:13px}
  .item .ty{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase;
    letter-spacing:.1em;align-self:center}
  .detail{border:1px solid var(--line);background:var(--panel);min-height:64vh;padding:20px 22px}
  .detail .title{font-family:var(--mono);font-size:20px;font-weight:600}
  .detail .sub{font-family:var(--mono);font-size:11px;color:var(--faint);text-transform:uppercase;
    letter-spacing:.14em;margin:6px 0 20px}
  .sect{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent-dim);margin:20px 0 9px}
  .kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .kv .k{font-family:var(--mono);color:var(--dim);min-width:130px;font-size:12px}
  .kv .src{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto}
  .rel{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:10px;align-items:center}
  .rel .pred{font-family:var(--mono);font-size:11px;color:var(--accent-dim);text-transform:uppercase}
  .lk{color:var(--accent);cursor:pointer;border-bottom:1px dotted var(--accent-dim)}
  .flag{font-family:var(--mono);font-size:10px;color:var(--warn);border:1px solid var(--warn);
    padding:1px 6px;letter-spacing:.1em}
  #cy{height:72vh;border:1px solid var(--line);background:
    radial-gradient(circle at 50% 50%,#0e120e,#090b09)}
  .legend{display:flex;gap:18px;font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:12px}
  .legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:middle}
  .ask-box{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
  .ask-row{display:flex;gap:10px;align-items:center}
  button{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    background:var(--accent);color:#0a0c0a;border:0;padding:11px 22px;cursor:pointer;font-weight:600}
  button:hover{background:#d6ff5e}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  button.ghost.on{color:var(--accent);border-color:var(--accent)}
  .ans{border:1px solid var(--line);background:var(--panel);padding:18px 20px;white-space:pre-wrap;
    line-height:1.7;font-size:14px}
  .meta{display:flex;gap:8px;margin:14px 0}
  .badge{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);padding:3px 9px;
    color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
  .badge.r{color:var(--accent);border-color:var(--accent-dim)}
  pre.sql{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);
    border-left:2px solid var(--accent-dim);padding:12px 14px;overflow:auto;color:#c9d4bf;margin:12px 0}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin:12px 0}
  th,td{border:1px solid var(--line);padding:7px 10px;text-align:left}
  th{color:var(--faint);text-transform:uppercase;font-size:10px;letter-spacing:.1em}
  .err{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);
    font-family:var(--mono);font-size:12px;padding:11px 14px;margin:12px 0}
  .cfg{border:1px solid var(--line);margin-bottom:16px}
  .cfg .h{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--warn);padding:11px 15px;border-bottom:1px solid var(--line);background:var(--warn-bg)}
  .cfg .m{padding:10px 15px;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:12px}
  .cfg .m:last-child{border:0}
  .cfg .m .s{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto;align-self:center}
  .empty{color:var(--faint);font-family:var(--mono);font-size:12px;padding:20px;text-align:center}
  .item.fail{border-left:2px solid var(--warn)}
  .item .ts{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.08em}
  .item .sg{font-family:var(--mono);font-size:10px;color:var(--accent-dim);text-transform:uppercase;letter-spacing:.1em;margin-right:8px}
  .item .tg{font-family:var(--mono);font-size:11px;color:var(--ink)}
  .item .md{font-family:var(--mono);font-size:10px;color:var(--faint);align-self:center}
  .ev-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  tr.case{cursor:pointer}
  tr.case:hover td{background:var(--panel2)}
  tr.case.bad td{color:var(--warn)}
  tr.detail td{background:var(--panel2);border-top:0;padding:14px 18px}
  tr.detail pre{font-family:var(--mono);font-size:11px;white-space:pre-wrap;color:var(--dim);margin:6px 0}
  .trace{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .step{font-family:var(--mono);font-size:11px;color:var(--ink);border-left:2px solid var(--accent-dim);
    padding:6px 10px;background:var(--panel)}
  .step .kind{color:var(--accent);font-weight:600;letter-spacing:.05em}
  .step.llm{border-left-color:#5ec8ff}
  .step.llm .kind{color:#5ec8ff}
  .step.err{border-left-color:var(--warn)}
  .step.err .kind{color:var(--warn)}
  .step .dim{color:var(--dim);margin-left:8px;font-size:10.5px}
  .step details{margin-top:6px}
  .step details summary{cursor:pointer;color:var(--dim);font-size:10.5px;letter-spacing:.05em}
  .step details pre{margin:6px 0;font-size:11px;color:#c9d4bf;background:var(--panel2);
    border:1px solid var(--line);padding:8px 10px;max-height:300px;overflow:auto}
  .step details b{display:block;color:var(--dim);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;margin-top:6px}
  .step-blocks{margin-top:6px;display:flex;flex-direction:column;gap:4px}
  .step-blocks b{display:block;color:var(--dim);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase}
  .step-blocks pre{margin:2px 0 4px;font-family:var(--mono);font-size:11px;color:#c9d4bf;
    background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent-dim);
    padding:8px 10px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">KG<b>//</b>CONSOLE</div>
    <div class="tag">knowledge graph · ops</div>
    <div class="chips" id="chips"></div>
  </header>
  <nav>
    <a data-v="overview" class="on">Overview</a>
    <a data-v="entities">Entities</a>
    <a data-v="graph">Graph</a>
    <a data-v="conflicts">Conflicts</a>
    <div class="sep"></div>
    <a data-v="ask">Ask</a>
    <a data-v="eval">Eval</a>
  </nav>
  <main>
    <section class="view on" id="overview">
      <h2>Overview</h2>
      <div class="kpis" id="kpis"></div>
      <div class="grid2">
        <div class="box"><h3>Entity types</h3><div class="body" id="types"></div></div>
        <div class="box"><h3>Recent documents</h3><div class="body" id="docs"></div></div>
      </div>
    </section>

    <section class="view" id="entities">
      <h2>Entities</h2>
      <div class="ent-layout">
        <div>
          <div class="toolbar"><input type="text" id="esearch" placeholder="検索…"></div>
          <div class="filters" id="efilters"></div>
          <div class="list" id="elist"></div>
        </div>
        <div class="detail" id="edetail">
          <div class="empty">← 実体を選択</div>
        </div>
      </div>
    </section>

    <section class="view" id="graph">
      <h2>Graph</h2>
      <div class="legend">
        <span><i style="background:#c4f24a"></i>org</span>
        <span><i style="background:#5ec8ff"></i>person</span>
        <span><i style="background:#e0a64a"></i>product/project</span>
        <span><i style="background:#9a8cff"></i>concept</span>
        <span><i style="background:#ff5468"></i>矛盾エッジ</span>
        <span style="color:var(--faint)">ノードクリックで近傍展開</span>
      </div>
      <div id="cy"></div>
    </section>

    <section class="view" id="conflicts">
      <h2>Conflicts</h2>
      <div id="cflist"></div>
    </section>

    <section class="view" id="eval">
      <h2>Eval Runs</h2>
      <div class="ent-layout">
        <div>
          <div class="filters" id="evfilters"></div>
          <div class="toolbar"><input type="text" id="evsearch" placeholder="model / tag を検索…"></div>
          <div class="list" id="evlist"></div>
        </div>
        <div class="detail" id="evdetail">
          <div class="empty">← run を選択</div>
        </div>
      </div>
    </section>

    <section class="view" id="ask">
      <h2>Ask</h2>
      <div class="ask-box">
        <textarea id="q" rows="3" placeholder="例) Acme の CEO は誰？ / 解約率の推移を出して"></textarea>
        <div class="ask-row">
          <button id="run">Run</button>
          <span class="tag" id="askhint">text2sql 生成 → 失敗時は FTS のみで回答</span>
        </div>
      </div>
      <div id="askout"></div>
    </section>
  </main>
</div>
<script>
const $=s=>document.querySelector(s), api=p=>fetch(p).then(r=>r.json());
let curType="";

document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{
  document.querySelectorAll('nav a').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  a.classList.add('on'); $('#'+a.dataset.v).classList.add('on');
  if(a.dataset.v==='graph') drawGraph(0);
  if(a.dataset.v==='conflicts') loadConflicts();
  if(a.dataset.v==='eval') loadEvalRuns();
});

async function boot(){
  const s=await api('/api/stats');
  $('#chips').innerHTML=
    `<span class="chip">ENT <b>${s.entities}</b></span>`+
    `<span class="chip">REL <b>${s.relations}</b></span>`+
    `<span class="chip ${s.conflicts?'warn':''}">CONFLICT <b>${s.conflicts}</b></span>`;
  $('#kpis').innerHTML=[
    ['documents',s.documents],['entities',s.entities],['relations',s.relations],
    ['facts',s.facts],['conflicts',s.conflicts]
  ].map(([l,n],i)=>`<div class="kpi ${l==='conflicts'&&n?'warn':''}">
     <div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  const mx=Math.max(1,...s.by_type.map(t=>t.n));
  $('#types').innerHTML=s.by_type.length?s.by_type.map(t=>
    `<div class="bar"><span class="name">${t.type}</span>
     <span class="track"><span class="fill" style="width:${t.n/mx*100}%"></span></span>
     <span class="v">${t.n}</span></div>`).join(''):'<div class="empty">データ無し</div>';
  const filt=['', ...s.by_type.map(t=>t.type)];
  $('#efilters').innerHTML=filt.map(t=>
    `<span class="f ${t===curType?'on':''}" data-t="${t}">${t||'all'}</span>`).join('');
  document.querySelectorAll('.f').forEach(f=>f.onclick=()=>{curType=f.dataset.t;boot();loadEntities();});
  const d=await api('/api/documents');
  $('#docs').innerHTML=d.length?d.slice(0,12).map(x=>
    `<div class="row"><b>${x.title||x.slug}</b><span>${x.ingested_at}</span></div>`).join('')
    :'<div class="empty">未取り込み</div>';
}

async function loadEntities(){
  const q=encodeURIComponent($('#esearch').value);
  const list=await api(`/api/entities?q=${q}&type=${encodeURIComponent(curType)}`);
  $('#elist').innerHTML=list.length?list.map(e=>
    `<div class="item" data-id="${e.id}"><span class="nm">${e.canonical_name}</span>
     <span class="ty">${e.type}</span></div>`).join(''):'<div class="empty">該当無し</div>';
  document.querySelectorAll('#elist .item').forEach(it=>it.onclick=()=>{
    document.querySelectorAll('#elist .item').forEach(x=>x.classList.remove('on'));
    it.classList.add('on'); showEntity(it.dataset.id);
  });
}
$('#esearch').oninput=()=>loadEntities();

async function showEntity(id){
  const d=await api('/api/entity/'+id);
  const flag=st=>st==='conflicted'?' <span class="flag">CONFLICT</span>':'';
  const fa=d.facts.map(f=>`<div class="kv"><span class="k">${f.a}</span>
     <span>${f.v}${flag(f.st)}</span><span class="src">${f.src}</span></div>`).join('')||'<div class="empty">—</div>';
  const ro=d.out.map(r=>`<div class="rel"><span class="pred">${r.p}</span>→
     <span class="lk" onclick="showEntity(${r.oid})">${r.o}</span>${flag(r.st)}
     <span class="src" style="margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--faint)">${r.src}</span></div>`).join('')||'<div class="empty">—</div>';
  const ri=d.in.map(r=>`<div class="rel"><span class="lk" onclick="showEntity(${r.sid})">${r.s}</span>
     <span class="pred">${r.p}</span>→ <i style="color:var(--dim)">本実体</i>${flag(r.st)}</div>`).join('')||'<div class="empty">—</div>';
  $('#edetail').innerHTML=`<div class="title">${d.entity.canonical_name}</div>
    <div class="sub">${d.entity.type} · #${d.entity.id} · alias: ${d.aliases.join(' / ')||'—'}</div>
    <div class="sect">Facts</div>${fa}
    <div class="sect">Relations · out</div>${ro}
    <div class="sect">Relations · in</div>${ri}`;
}

let cy;
async function drawGraph(focus){
  const g=await api('/api/graph?focus='+focus);
  const col={org:'#c4f24a',person:'#5ec8ff',product:'#e0a64a',project:'#e0a64a',concept:'#9a8cff'};
  cy=cytoscape({container:$('#cy'),
    elements:[...g.nodes,...g.edges],
    style:[
      {selector:'node',style:{'background-color':e=>col[e.data('type')]||'#7f8a78',
        'label':'data(label)','color':'#dfe6da','font-family':'IBM Plex Mono','font-size':10,
        'text-valign':'bottom','text-margin-y':4,'width':16,'height':16}},
      {selector:'edge',style:{'width':1,'line-color':'#2c3528','target-arrow-color':'#2c3528',
        'target-arrow-shape':'triangle','curve-style':'bezier','label':'data(label)',
        'font-family':'IBM Plex Mono','font-size':8,'color':'#525a4e','arrow-scale':.7}},
      {selector:'edge[?conflict]',style:{'line-color':'#ff5468','target-arrow-color':'#ff5468',
        'color':'#ff5468','width':2}}
    ],
    layout:{name:'cose',animate:false,nodeRepulsion:9000,idealEdgeLength:90}});
  cy.on('tap','node',e=>drawGraph(e.target.id()));
}

async function loadConflicts(){
  const c=await api('/api/conflicts');
  let h='';
  if(c.relations.length){h+='<div class="sect" style="margin-top:0">関係の矛盾</div>';
    c.relations.forEach(g=>{h+=`<div class="cfg"><div class="h">group ${g.group} · ${g.members.length} 件</div>`+
      g.members.map(m=>`<div class="m"><b>${m.s}</b> —${m.p}→ <b>${m.o}</b>
        <span class="s">${m.src}</span></div>`).join('')+'</div>';});}
  if(c.facts.length){h+='<div class="sect">属性の矛盾</div>';
    c.facts.forEach(g=>{h+=`<div class="cfg"><div class="h">group ${g.group} · ${g.members.length} 件</div>`+
      g.members.map(m=>`<div class="m"><b>${m.n}</b>.${m.a} = <b>${m.v}</b>
        <span class="s">${m.src}</span></div>`).join('')+'</div>';});}
  $('#cflist').innerHTML=h||'<div class="empty">矛盾は検出されていません</div>';
}

$('#run').onclick=async()=>{
  const q=$('#q').value.trim(); if(!q)return;
  $('#askout').innerHTML='<div class="empty">問い合わせ中…（要約/抽出/回答に時間がかかる場合があります）</div>';
  let r;
  try{ r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({question:q})}).then(x=>x.json()); }
  catch(e){ $('#askout').innerHTML='<div class="err">サーバ通信失敗</div>'; return; }
  let h='';
  if(r.error) h+=`<div class="err">⚠ ${r.error}</div>`;
  h+=`<div class="meta"><span class="badge r">route: ${r.route||'-'}</span>`+
     `<span class="badge">rows: ${(r.rows||[]).length}</span>`+
     `<span class="badge">docs: ${(r.docs||[]).length}</span></div>`;
  h+=`<div class="ans">${(r.answer||'(回答生成不可 — Ollama 未起動の可能性)').replace(/</g,'&lt;')}</div>`;
  if(r.sql) h+=`<div class="sect">生成 SQL（read-only 検証済）</div><pre class="sql">${r.sql.replace(/</g,'&lt;')}</pre>`;
  if(r.rows&&r.rows.length){const k=Object.keys(r.rows[0]);
    h+='<div class="sect">構造化結果</div><table><tr>'+k.map(x=>`<th>${x}</th>`).join('')+'</tr>'+
      r.rows.slice(0,40).map(row=>'<tr>'+k.map(x=>`<td>${String(row[x]??'')}</td>`).join('')+'</tr>').join('')+'</table>';}
  if(r.docs&&r.docs.length){h+='<div class="sect">関連文書</div>'+
    r.docs.map(d=>`<div class="row"><b>${d.slug}</b><span>${(d.snippet||'').replace(/</g,'&lt;')}</span></div>`).join('');}
  $('#askout').innerHTML=h;
};

// ===== Eval =====
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let evRuns=[], evStage='all', evSelected=null;

async function loadEvalRuns(){
  evRuns=await api('/api/eval/runs');
  const stages=['all','query','extract','dedup'];
  $('#evfilters').innerHTML=stages.map(s=>
    `<span class="f ${s===evStage?'on':''}" data-s="${s}">${s}</span>`).join('');
  document.querySelectorAll('#evfilters .f').forEach(f=>f.onclick=()=>{
    evStage=f.dataset.s; renderEvalList();
  });
  $('#evsearch').oninput=()=>renderEvalList();
  renderEvalList();
}

function renderEvalList(){
  const q=($('#evsearch').value||'').toLowerCase();
  const rows=evRuns.filter(r=>{
    if(r.error) return false;
    const st=(r.meta||{}).stage||'';
    if(evStage!=='all' && st!==evStage) return false;
    if(!q) return true;
    const blob=`${(r.meta||{}).model||''} ${(r.meta||{}).tag||''}`.toLowerCase();
    return blob.includes(q);
  });
  if(!rows.length){ $('#evlist').innerHTML='<div class="empty">該当 run 無し</div>'; return; }
  $('#evlist').innerHTML=rows.map(r=>{
    const m=r.meta||{};
    const ts=(m.timestamp_utc||'').replace('T',' ').replace(/-(\d\d)-(\d\d)Z$/,':$1:$2Z').slice(0,19);
    const fail=r.has_failures?' fail':'';
    const cur=evSelected===r.filename?' on':'';
    return `<div class="item${fail}${cur}" data-f="${esc(r.filename)}">
      <div>
        <span class="sg">${esc(m.stage||'?')}</span><span class="tg">${esc(m.tag||'-')}</span>
        <div class="ts">${esc(ts)}</div>
      </div>
      <span class="md">${esc(m.model||'')}</span>
    </div>`;
  }).join('');
  document.querySelectorAll('#evlist .item').forEach(it=>it.onclick=()=>{
    evSelected=it.dataset.f;
    document.querySelectorAll('#evlist .item').forEach(x=>x.classList.remove('on'));
    it.classList.add('on');
    showEvalRun(it.dataset.f);
  });
}

async function showEvalRun(filename){
  const data=await api('/api/eval/run/'+encodeURIComponent(filename));
  if(data.error){ $('#evdetail').innerHTML=`<div class="err">${esc(data.error)}</div>`; return; }
  const m=data.meta||{}, res=data.result||{};
  const gs=res.gold_summary||{}, agg=res.aggregate||{}, cases=res.per_case||[];
  const stage=m.stage||'unknown';

  const goldName=(m.gold_path||'').split(/[\\/]/).pop()||'-';
  const gitShort=(m.git_rev||'').slice(0,7);
  const chips=[
    ['stage',stage],['tag',m.tag],['model',m.model],['runs',m.runs],
    ['git',gitShort],['t',m.timestamp_utc],['gold',goldName]
  ].map(([k,v])=>`<span class="chip">${esc(k)} <b>${esc(v??'-')}</b></span>`).join('');

  const goldRow=Object.entries(gs).map(([k,v])=>
    `<div class="row"><b>${esc(k)}</b><span>${esc(typeof v==='object'?JSON.stringify(v):v)}</span></div>`
  ).join('')||'<div class="empty">—</div>';

  const aggHtml=renderAggregate(stage, agg);
  const caseHtml=renderCases(stage, cases);
  const perRunTraces=(res.per_run||[]).filter(r=>r && r.trace && r.trace.length);
  let runTraceHtml='';
  if(perRunTraces.length){
    runTraceHtml='<div class="sect">Per-run trace</div>'+perRunTraces.map(r=>
      `<details style="margin:6px 0"><summary class="dim" style="font-family:var(--mono);font-size:11px;cursor:pointer">run ${esc(r.run)} · ${r.trace.length} steps</summary>${renderTrace(r.trace)}</details>`
    ).join('');
  }

  $('#evdetail').innerHTML=
    `<div class="ev-meta">${chips}</div>
     <div class="sect">Gold summary</div>${goldRow}
     <div class="sect">Aggregate</div>${aggHtml}
     ${runTraceHtml}
     <div class="sect">Per-case (${cases.length})</div>${caseHtml}`;

  // 行クリックで詳細展開: trace タイムライン + raw JSON (折りたたみ)
  document.querySelectorAll('#evdetail tr.case').forEach(tr=>tr.onclick=()=>{
    const next=tr.nextElementSibling;
    if(next && next.classList.contains('detail')){ next.remove(); return; }
    const obj=JSON.parse(tr.dataset.json);
    const cols=tr.parentElement.querySelector('tr').children.length;
    const det=document.createElement('tr');
    det.className='detail';
    const traceHtml=renderTrace(obj.trace);
    const rawHtml=`<details><summary class="dim" style="font-family:var(--mono);font-size:10.5px;color:var(--dim);cursor:pointer;margin-top:12px">raw json</summary><pre>${esc(JSON.stringify(obj,null,2))}</pre></details>`;
    det.innerHTML=`<td colspan="${cols}"><div class="sect" style="margin:0 0 6px">Trace (${(obj.trace||[]).length} steps)</div>${traceHtml}${rawHtml}</td>`;
    tr.after(det);
  });
}

function renderTrace(trace){
  if(!trace || !trace.length) return '<div class="empty">trace 無し（古い run か、その経路で LLM/note が走らなかった）</div>';
  return '<div class="trace">'+trace.map(renderStep).join('')+'</div>';
}

function renderStep(e){
  const kind=e.kind||'step';
  const isLLM=kind.startsWith('llm.');
  const hasErr=!!e.error;
  const cls=hasErr?'err':(isLLM?'llm':'');
  const elapsed=(e.elapsed_ms!=null)?`<span class="dim">${e.elapsed_ms}ms</span>`:'';
  const skip=new Set(['kind','t_ms','prompt','response','elapsed_ms']);
  // 「長い / 複数行」の値は inline の dim ではなく pre ブロックに分離して表示
  const inlineParts=[], blockParts=[];
  for(const [k,v] of Object.entries(e)){
    if(skip.has(k)) continue;
    const sv=(v==null)?'':(typeof v==='object'?JSON.stringify(v,null,2):String(v));
    if(sv.includes('\n') || sv.length>80){
      blockParts.push(`<b>${esc(k)}</b><pre>${esc(sv)}</pre>`);
    } else {
      inlineParts.push(`<span class="dim">${esc(k)}=${esc(sv)}</span>`);
    }
  }
  const meta=inlineParts.join(' ');
  const blocks=blockParts.length?`<div class="step-blocks">${blockParts.join('')}</div>`:'';
  let llmBody='';
  if(isLLM && (e.prompt||e.response)){
    llmBody=`<details><summary>prompt / response</summary>
      <b>prompt</b><pre>${esc(e.prompt||'')}</pre>
      <b>response</b><pre>${esc(e.response==null?'(なし)':e.response)}</pre>
    </details>`;
  }
  return `<div class="step ${cls}"><span class="kind">${esc(kind)}</span> ${elapsed} ${meta}${blocks}${llmBody}</div>`;
}

function bar(name, mean, std){
  const v=Number(mean||0), s=Number(std||0);
  const pct=Math.max(0,Math.min(100, v*100));
  const sd=s?` ± ${s.toFixed(3)}`:'';
  return `<div class="bar"><span class="name">${esc(name)}</span>
    <span class="track"><span class="fill" style="width:${pct}%"></span></span>
    <span class="v">${v.toFixed(3)}${sd}</span></div>`;
}

function renderAggregate(stage, agg){
  const pick=(k)=>[agg[k+'_mean'], agg[k+'_std']];
  let keys=[];
  if(stage==='query'){
    keys=['route_accuracy','sql_success_rate','row_contains_rate','doc_slug_rate'];
  } else if(stage==='dedup'){
    keys=['accuracy','precision','recall','f1','level_match_rate'];
  } else if(stage==='extract'){
    keys=[];
    for(const cat of ['entities','relations','facts'])
      for(const m of ['precision','recall','f1']) keys.push(`${cat}_${m}`);
  } else {
    // 未知 stage は *_mean を機械的に拾う
    keys=Object.keys(agg).filter(k=>k.endsWith('_mean')).map(k=>k.slice(0,-5));
  }
  if(!keys.length) return '<div class="empty">aggregate 無し</div>';
  return keys.map(k=>{const [mn,sd]=pick(k); return bar(k,mn,sd);}).join('');
}

function renderCases(stage, cases){
  if(!cases.length) return '<div class="empty">失敗ケース無し</div>';
  if(stage==='query') return renderCasesQuery(cases);
  if(stage==='extract') return renderCasesExtract(cases);
  if(stage==='dedup') return renderCasesDedup(cases);
  // fallback: label + raw json
  const rows=cases.map(c=>`<tr class="case" data-json="${esc(JSON.stringify(c))}">
    <td>${esc(c.label||'-')}</td></tr>`).join('');
  return `<table><tr><th>label</th></tr>${rows}</table>`;
}

function renderCasesQuery(cases){
  const rows=cases.map(c=>{
    const routeOk=c.expected_route===c.predicted_route;
    const bad=!routeOk || c.error || (c.missed_contains||[]).length || (c.missed_slugs||[]).length;
    const route=`${esc(c.expected_route||'-')} → <b style="color:${routeOk?'var(--ink)':'var(--warn)'}">${esc(c.predicted_route||'-')}</b>`;
    const sqlOk=c.sql_ok===true?'ok':(c.sql_ok===false?'NG':'-');
    const row=c.row_contains_rate==null?'-':(c.row_contains_rate).toFixed(2);
    const miss=(c.missed_contains||[]).map(x=>`${esc(x.column)}=${esc(x.value)}`).join(' / ');
    return `<tr class="case ${bad?'bad':''}" data-json="${esc(JSON.stringify(c))}">
      <td>${esc(c.label||'-')}</td>
      <td>${route}</td>
      <td>${sqlOk}</td>
      <td>${row}</td>
      <td>${esc(miss)}</td>
      <td>${esc(c.error||'-')}</td>
    </tr>`;
  }).join('');
  return `<table><tr>
    <th>label</th><th>route exp→pred</th><th>sql</th><th>row%</th>
    <th>missed_contains</th><th>error</th></tr>${rows}</table>`;
}

function renderCasesExtract(cases){
  const rows=cases.map(c=>{
    const item={...c}; delete item.label; delete item.category; delete item.kind;
    return `<tr class="case ${c.kind==='missed'?'bad':''}" data-json="${esc(JSON.stringify(c))}">
      <td>${esc(c.category||'-')}</td>
      <td>${esc(c.kind||'-')}</td>
      <td>${esc(JSON.stringify(item))}</td>
    </tr>`;
  }).join('');
  return `<table><tr><th>category</th><th>kind</th><th>item</th></tr>${rows}</table>`;
}

function renderCasesDedup(cases){
  const rows=cases.map(c=>{
    const bad=!c.correct;
    const lvl=c.level_match===true?'ok':(c.level_match===false?'NG':'-');
    return `<tr class="case ${bad?'bad':''}" data-json="${esc(JSON.stringify(c))}">
      <td>${esc(c.a)} ↔ ${esc(c.b)}</td>
      <td>${esc(c.expected||'-')} / ${esc(c.predicted||'-')}</td>
      <td>${esc(c.how_a||'-')} / ${esc(c.how_b||'-')}</td>
      <td>${lvl}</td>
    </tr>`;
  }).join('');
  return `<table><tr><th>a ↔ b</th><th>expected / predicted</th>
    <th>how_a / how_b</th><th>level</th></tr>${rows}</table>`;
}

boot(); loadEntities();
</script>
