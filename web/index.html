<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KG // CONSOLE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cytoscape/3.30.2/cytoscape.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<style>
  :root{
    --bg:#0a0c0a; --panel:#101410; --panel2:#0d100d; --line:#1f261f;
    --ink:#dfe6da; --dim:#7f8a78; --faint:#525a4e;
    --accent:#c4f24a; --accent-dim:#7d9430; --warn:#ff5468; --warn-bg:#2a1216;
    --mono:'IBM Plex Mono',ui-monospace,monospace;
    --sans:'IBM Plex Sans JP','IBM Plex Mono',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:46px 46px;background-position:-1px -1px;
  }
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at 20% 0%,rgba(196,242,74,.05),transparent 55%);}
  .app{display:grid;grid-template-columns:188px 1fr;grid-template-rows:58px 1fr;height:100vh}
  header{grid-column:1/3;display:flex;align-items:center;gap:22px;padding:0 22px;
    border-bottom:1px solid var(--line);background:var(--panel2)}
  .brand{font-family:var(--mono);font-weight:600;letter-spacing:.16em;font-size:15px}
  .brand b{color:var(--accent)}
  .tag{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.22em;text-transform:uppercase}
  .chips{margin-left:auto;display:flex;gap:10px}
  .chip{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:5px 11px;
    color:var(--dim);display:flex;gap:7px;align-items:center}
  .chip b{color:var(--ink);font-weight:600}
  .chip.warn{border-color:var(--warn);color:var(--warn)}
  .chip.warn b{color:var(--warn)}
  nav{border-right:1px solid var(--line);background:var(--panel2);padding:18px 0}
  nav a{display:block;font-family:var(--mono);font-size:12px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--dim);padding:11px 22px;cursor:pointer;
    border-left:2px solid transparent}
  nav a:hover{color:var(--ink);background:var(--panel)}
  nav a.on{color:var(--accent);border-left-color:var(--accent);background:var(--panel)}
  nav .sep{height:1px;background:var(--line);margin:14px 22px}
  main{overflow:auto;padding:26px 30px}
  .view{display:none;animation:in .4s ease both}
  .view.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h2{font-family:var(--mono);font-weight:600;font-size:13px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--accent);margin-bottom:16px;
    border-bottom:1px solid var(--line);padding-bottom:10px}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);
    border:1px solid var(--line);margin-bottom:26px}
  .kpi{background:var(--panel);padding:18px 20px}
  .kpi .n{font-family:var(--mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;
    letter-spacing:-.01em;line-height:1}
  .kpi.warn .n{color:var(--warn)}
  .kpi .l{font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--faint);margin-top:9px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .box{border:1px solid var(--line);background:var(--panel)}
  .box h3{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--dim);padding:13px 16px;border-bottom:1px solid var(--line)}
  .box .body{padding:14px 16px}
  .bar{display:flex;align-items:center;gap:12px;margin:9px 0;font-family:var(--mono);font-size:12px}
  .bar .name{width:96px;color:var(--dim);text-transform:uppercase;font-size:11px;letter-spacing:.08em}
  .bar .track{flex:1;height:8px;background:var(--panel2);border:1px solid var(--line)}
  .bar .fill{height:100%;background:var(--accent-dim)}
  .bar .v{width:34px;text-align:right;font-variant-numeric:tabular-nums}
  .row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);
    font-family:var(--mono);font-size:12px;color:var(--dim)}
  .row:last-child{border:0}
  .row b{color:var(--ink);font-weight:500}
  .ent-layout{display:grid;grid-template-columns:320px 1fr;gap:22px}
  .toolbar{display:flex;gap:8px;margin-bottom:14px}
  input[type=text],textarea{background:var(--panel2);border:1px solid var(--line);color:var(--ink);
    font-family:var(--mono);font-size:13px;padding:10px 12px;width:100%;outline:none}
  input[type=text]:focus,textarea:focus{border-color:var(--accent-dim)}
  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .f{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:4px 10px;
    color:var(--dim);cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
  .f.on{border-color:var(--accent);color:var(--accent)}
  .list{border:1px solid var(--line);max-height:64vh;overflow:auto}
  .item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;
    display:flex;justify-content:space-between;gap:10px}
  .item:hover{background:var(--panel)}
  .item.on{background:var(--panel);border-left:2px solid var(--accent)}
  .item .nm{font-size:13px}
  .item .ty{font-family:var(--mono);font-size:10px;color:var(--faint);text-transform:uppercase;
    letter-spacing:.1em;align-self:center}
  .detail{border:1px solid var(--line);background:var(--panel);min-height:64vh;padding:20px 22px}
  .detail .title{font-family:var(--mono);font-size:20px;font-weight:600}
  .detail .sub{font-family:var(--mono);font-size:11px;color:var(--faint);text-transform:uppercase;
    letter-spacing:.14em;margin:6px 0 20px}
  .sect{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent-dim);margin:20px 0 9px}
  .kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .kv .k{font-family:var(--mono);color:var(--dim);min-width:130px;font-size:12px}
  .kv .src{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto}
  .rel{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:10px;align-items:center}
  .rel .pred{font-family:var(--mono);font-size:11px;color:var(--accent-dim);text-transform:uppercase}
  .lk{color:var(--accent);cursor:pointer;border-bottom:1px dotted var(--accent-dim)}
  .flag{font-family:var(--mono);font-size:10px;color:var(--warn);border:1px solid var(--warn);
    padding:1px 6px;letter-spacing:.1em}
  #cy{height:72vh;border:1px solid var(--line);background:
    radial-gradient(circle at 50% 50%,#0e120e,#090b09)}
  .legend{display:flex;gap:18px;font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:12px}
  .legend i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:middle}
  .ask-box{display:flex;flex-direction:column;gap:10px;margin-bottom:20px}
  .ask-row{display:flex;gap:10px;align-items:center}
  button{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    background:var(--accent);color:#0a0c0a;border:0;padding:11px 22px;cursor:pointer;font-weight:600}
  button:hover{background:#d6ff5e}
  button.ghost{background:transparent;color:var(--dim);border:1px solid var(--line)}
  button.ghost.on{color:var(--accent);border-color:var(--accent)}
  .ans{border:1px solid var(--line);background:var(--panel);padding:18px 20px;white-space:pre-wrap;
    line-height:1.7;font-size:14px}
  .meta{display:flex;gap:8px;margin:14px 0}
  .badge{font-family:var(--mono);font-size:10.5px;border:1px solid var(--line);padding:3px 9px;
    color:var(--dim);text-transform:uppercase;letter-spacing:.1em}
  .badge.r{color:var(--accent);border-color:var(--accent-dim)}
  pre.sql{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);
    border-left:2px solid var(--accent-dim);padding:12px 14px;overflow:auto;color:#c9d4bf;margin:12px 0}
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;margin:12px 0}
  th,td{border:1px solid var(--line);padding:7px 10px;text-align:left}
  th{color:var(--faint);text-transform:uppercase;font-size:10px;letter-spacing:.1em}
  .err{border:1px solid var(--warn);background:var(--warn-bg);color:var(--warn);
    font-family:var(--mono);font-size:12px;padding:11px 14px;margin:12px 0}
  .cfg{border:1px solid var(--line);margin-bottom:16px}
  .cfg .h{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--warn);padding:11px 15px;border-bottom:1px solid var(--line);background:var(--warn-bg)}
  .cfg .m{padding:10px 15px;border-bottom:1px solid var(--line);font-size:13px;display:flex;gap:12px}
  .cfg .m:last-child{border:0}
  .cfg .m .s{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-left:auto;align-self:center}
  .empty{color:var(--faint);font-family:var(--mono);font-size:12px;padding:20px;text-align:center}
  .item .ts{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.08em}
  .item .sg{font-family:var(--mono);font-size:10px;color:var(--accent-dim);text-transform:uppercase;letter-spacing:.1em;margin-right:8px}
  .item .tg{font-family:var(--mono);font-size:11px;color:var(--ink)}
  .item .md{font-family:var(--mono);font-size:10px;color:var(--faint);align-self:center}
  .item .gd{font-family:var(--mono);font-size:10.5px;color:var(--accent-dim);align-self:center;margin-left:8px}
  .item .gd b{color:var(--ink);font-weight:500}
  .item.s-good{border-left:2px solid #4dd28c}      /* >=0.9 緑 */
  .item.s-ok{border-left:2px solid var(--accent-dim)} /* 0.7-0.9 黄緑 */
  .item.s-warn{border-left:2px solid #e0a64a}      /* 0.5-0.7 橙 */
  .item.s-bad{border-left:2px solid var(--warn)}   /* <0.5 赤 */
  .item.s-na{border-left:2px solid var(--line)}    /* スコア無し */
  .item .scorebox{display:flex;align-items:center;gap:8px;margin-left:auto;align-self:center}
  .item .sval{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;
    color:var(--ink);font-weight:600;letter-spacing:.02em}
  .item.s-good .sval{color:#4dd28c}
  .item.s-ok .sval{color:var(--accent)}
  .item.s-warn .sval{color:#e0a64a}
  .item.s-bad .sval{color:var(--warn)}
  .item .hl{font-family:var(--mono);font-size:10.5px;color:var(--dim);margin-top:4px;
    display:flex;flex-wrap:wrap;gap:8px}
  .item .hl b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
  .ev-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  tr.case{cursor:pointer}
  tr.case:hover td{background:var(--panel2)}
  tr.case.bad td{color:var(--warn)}
  tr.detail td{background:var(--panel2);border-top:0;padding:14px 18px}
  tr.detail pre{font-family:var(--mono);font-size:11px;white-space:pre-wrap;color:var(--dim);margin:6px 0}
  .trace{display:flex;flex-direction:column;gap:6px;margin-top:6px}
  .step{font-family:var(--mono);font-size:11px;color:var(--ink);border-left:2px solid var(--accent-dim);
    padding:6px 10px;background:var(--panel)}
  .step .kind{color:var(--accent);font-weight:600;letter-spacing:.05em}
  .step.llm{border-left-color:#5ec8ff}
  .step.llm .kind{color:#5ec8ff}
  .step.err{border-left-color:var(--warn)}
  .step.err .kind{color:var(--warn)}
  .step .dim{color:var(--dim);margin-left:8px;font-size:10.5px}
  .step details{margin-top:6px}
  .step details summary{cursor:pointer;color:var(--dim);font-size:10.5px;letter-spacing:.05em}
  .step details pre{margin:6px 0;font-size:11px;color:#c9d4bf;background:var(--panel2);
    border:1px solid var(--line);padding:8px 10px;max-height:300px;overflow:auto}
  .step details b{display:block;color:var(--dim);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase;margin-top:6px}
  .step-blocks{margin-top:6px;display:flex;flex-direction:column;gap:4px}
  .step-blocks b{display:block;color:var(--dim);font-size:10px;letter-spacing:.1em;
    text-transform:uppercase}
  .step-blocks pre{margin:2px 0 4px;font-family:var(--mono);font-size:11px;color:#c9d4bf;
    background:var(--panel2);border:1px solid var(--line);border-left:2px solid var(--accent-dim);
    padding:8px 10px;max-height:260px;overflow:auto;white-space:pre-wrap;word-break:break-all}
  .gloss{border-bottom:1px dotted var(--accent-dim);cursor:help}
  #glosstip{position:fixed;display:none;max-width:380px;font-family:var(--mono);font-size:11.5px;
    line-height:1.55;color:var(--ink);background:var(--panel2);border:1px solid var(--accent-dim);
    padding:9px 12px;z-index:1000;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.55);
    white-space:pre-wrap}
  #glosstip.pinned{border-color:var(--accent);pointer-events:auto}
  #glosstip b{display:block;color:var(--accent);font-weight:600;letter-spacing:.04em;
    margin-bottom:4px;font-size:11px;text-transform:none}
  #glosstip .pin{font-size:10px;color:var(--faint);margin-top:6px;display:block}
  /* Proposals / Staging / Weak rels viz */
  .diff2col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}
  .cy-canvas{height:420px;border:1px solid var(--line);
    background:radial-gradient(circle at 50% 50%,#0e120e,#090b09)}
  .flag.col-add{color:#4dd28c;border-color:#4dd28c}
  .flag.col-del{color:var(--warn);border-color:var(--warn)}
  .flag.col-kept{color:var(--faint);border-color:var(--faint)}
  .bar.sim .fill{background:var(--accent-dim)}
  .bar.sim.exact .fill{background:#4dd28c}
  .bar.sim .name{width:auto;flex:1;color:var(--ink);text-transform:none;
    letter-spacing:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar.sim .name .tbl{color:var(--dim);margin-right:6px}
  .bar.sim .act{margin-left:8px}
  .col-list .kv{padding:5px 0}
  .col-list .kv .k{min-width:0;flex:1;color:var(--ink);font-family:var(--sans)}
  .col-list .kv .ty{font-family:var(--mono);font-size:11px;color:var(--dim);min-width:90px;text-align:right}
  .wnode-leg{display:flex;flex-wrap:wrap;gap:14px;font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:8px}
  .wnode-leg i{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:middle;border-radius:50%}
  .wrow{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:6px 0;
    border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;align-items:center}
  .wrow .triple b{color:var(--ink);font-weight:500}
  .wrow .triple .pred{color:var(--accent-dim);margin:0 6px}
  .wrow .doc{color:var(--faint);font-size:11px}
  .wrow .conf{color:var(--dim);font-variant-numeric:tabular-nums}
  /* Entity detail viz */
  .claim-row{display:grid;grid-template-columns:130px 1fr 160px auto auto;gap:10px;
    align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
  .claim-row .col{font-family:var(--mono);font-size:11px;color:var(--dim);
    letter-spacing:.06em;text-transform:uppercase}
  .claim-row .val{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .claim-row .conf{display:flex;align-items:center;gap:6px}
  .claim-row .conf .track{height:6px;width:90px;background:var(--panel2);border:1px solid var(--line)}
  .claim-row .conf .fill{height:100%;background:var(--accent-dim)}
  .claim-row .conf .v{font-family:var(--mono);font-size:10.5px;color:var(--dim);
    width:34px;text-align:right;font-variant-numeric:tabular-nums}
  .claim-row .src{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .rcard{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;
    padding:8px 12px;border:1px solid var(--line);background:var(--panel2);margin:6px 0;font-size:13px}
  .rcard .kindbg{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--accent-dim);background:var(--panel);border:1px solid var(--line);padding:3px 8px;min-width:110px;text-align:center}
  .rcard .triple{display:flex;flex-wrap:wrap;align-items:center;gap:6px;overflow:hidden}
  .rcard .triple .role{color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.04em}
  .rcard .triple .arrow{color:var(--accent-dim);font-family:var(--mono)}
  .rcard .triple .other{color:var(--accent);cursor:pointer;border-bottom:1px dotted var(--accent-dim)}
  .rcard .triple .other.text{color:var(--ink);cursor:default;border-bottom:0;font-style:italic}
  .rcard .attrs{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end}
  .rcard .attrs .badge{font-size:10px}
  .rcard .meta{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--dim);justify-self:end;white-space:nowrap}
  .rgroup{margin:14px 0 6px 0;font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent-dim);border-bottom:1px solid var(--line);padding-bottom:4px}
  .ent-graph{height:280px;border:1px solid var(--line);background:
    radial-gradient(circle at 50% 50%,#0e120e,#090b09);margin-top:10px}
  /* Eval viz */
  .ev-charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
  .ev-chart{height:200px;border:1px solid var(--line);background:var(--panel2)}
  .ev-chart-wide{height:140px;border:1px solid var(--line);background:var(--panel2);margin:10px 0}
  .step .timebar{display:inline-block;height:5px;background:var(--accent-dim);
    margin-left:6px;vertical-align:middle;border:1px solid var(--line);max-width:120px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">KG<b>//</b>CONSOLE</div>
    <div class="tag">knowledge graph · ops</div>
    <div class="chips" id="chips"></div>
  </header>
  <nav>
    <a data-v="overview" class="on">Overview</a>
    <a data-v="entities">Entities</a>
    <a data-v="conflicts">Conflicts</a>
    <div class="sep"></div>
    <a data-v="proposals">Proposals</a>
    <a data-v="staging">Staging</a>
    <a data-v="weak">Weak Rels</a>
    <div class="sep"></div>
    <a data-v="ask">Ask</a>
    <a data-v="eval">Eval</a>
  </nav>
  <main>
    <section class="view on" id="overview">
      <h2>Overview</h2>
      <div class="kpis" id="kpis"></div>
      <div class="grid2">
        <div class="box"><h3>Entity types</h3><div class="body" id="types"></div></div>
        <div class="box"><h3>Recent documents</h3><div class="body" id="docs"></div></div>
      </div>
    </section>

    <section class="view" id="entities">
      <h2>Entities</h2>
      <div class="ent-layout">
        <div>
          <div class="toolbar"><input type="text" id="esearch" placeholder="検索…"></div>
          <div class="filters" id="efilters"></div>
          <div class="list" id="elist"></div>
        </div>
        <div class="detail" id="edetail">
          <div class="empty">← 実体を選択</div>
        </div>
      </div>
    </section>

    <section class="view" id="conflicts">
      <h2>Conflicts</h2>
      <div id="cflist"></div>
    </section>

    <section class="view" id="proposals">
      <h2>Schema Proposals</h2>
      <div id="plist"></div>
    </section>

    <section class="view" id="staging">
      <h2>Staging Extractions</h2>
      <div id="slist"></div>
    </section>

    <section class="view" id="weak">
      <h2>Weak Relations</h2>
      <div id="wlist"></div>
    </section>

    <section class="view" id="eval">
      <h2>Eval Runs</h2>
      <div class="ent-layout">
        <div>
          <div class="filters" id="evfilters"></div>
          <div class="toolbar"><input type="text" id="evsearch" placeholder="model / tag を検索…"></div>
          <div class="list" id="evlist"></div>
        </div>
        <div class="detail" id="evdetail">
          <div class="empty">← run を選択</div>
        </div>
      </div>
    </section>

    <section class="view" id="ask">
      <h2>Ask</h2>
      <div class="ask-box">
        <textarea id="q" rows="3" placeholder="例) Acme の CEO は誰？ / 解約率の推移を出して"></textarea>
        <div class="ask-row">
          <button id="run">Run</button>
          <span class="tag" id="askhint">text2sql 生成 → 失敗時は FTS のみで回答</span>
        </div>
      </div>
      <div id="askout"></div>
    </section>
  </main>
</div>
<script>
const $=s=>document.querySelector(s), api=p=>fetch(p).then(r=>r.json());
let curType="";

document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>{
  document.querySelectorAll('nav a').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
  a.classList.add('on'); $('#'+a.dataset.v).classList.add('on');
  if(a.dataset.v==='conflicts') loadConflicts();
  if(a.dataset.v==='proposals') loadProposals();
  if(a.dataset.v==='staging') loadStaging();
  if(a.dataset.v==='weak') loadWeak();
  if(a.dataset.v==='entities') loadEntities();
  if(a.dataset.v==='eval') loadEvalRuns();
});

async function boot(){
  const s=await api('/api/stats');
  const totalEnt=Object.values(s.entities||{}).reduce((a,b)=>a+b,0);
  const totalRel=Object.values(s.relations||{}).reduce((a,b)=>a+b,0);
  $('#chips').innerHTML=
    `<span class="chip">ENT <b>${totalEnt}</b></span>`+
    `<span class="chip">REL <b>${totalRel}</b></span>`+
    `<span class="chip ${s.open_conflicts?'warn':''}">CONFLICT <b>${s.open_conflicts||0}</b></span>`+
    `<span class="chip ${s.pending_proposals?'warn':''}">PROP <b>${s.pending_proposals||0}</b></span>`+
    `<span class="chip ${s.pending_staging?'warn':''}">STAGE <b>${s.pending_staging||0}</b></span>`;
  $('#kpis').innerHTML=[
    ['documents',s.documents],['entities',totalEnt],['relations',totalRel],
    ['weak',s.weak_relations||0],['conflicts',s.open_conflicts||0]
  ].map(([l,n],i)=>`<div class="kpi ${l==='conflicts'&&n?'warn':''}">
     <div class="n">${n}</div><div class="l">${l}</div></div>`).join('');
  const byType=Object.entries(s.entities||{}).map(([type,n])=>({type,n}));
  const mx=Math.max(1,...byType.map(t=>t.n));
  $('#types').innerHTML=byType.length?byType.map(t=>
    `<div class="bar"><span class="name">${t.type}</span>
     <span class="track"><span class="fill" style="width:${t.n/mx*100}%"></span></span>
     <span class="v">${t.n}</span></div>`).join(''):'<div class="empty">データ無し</div>';
  const filt=['', ...byType.map(t=>t.type)];
  $('#efilters').innerHTML=filt.map(t=>
    `<span class="f ${t===curType?'on':''}" data-t="${t}">${t||'all'}</span>`).join('');
  document.querySelectorAll('.f').forEach(f=>f.onclick=()=>{curType=f.dataset.t;loadEntities();});
  const d=await api('/api/documents');
  $('#docs').innerHTML=d.length?d.slice(0,12).map(x=>
    `<div class="row"><b>${x.title||x.slug}</b><span>${x.ingested_at}</span></div>`).join('')
    :'<div class="empty">未取り込み</div>';
}

async function loadEntities(){
  const q=encodeURIComponent($('#esearch').value);
  const tables=curType?[curType]:['person','organization','product','project'];
  const all=[];
  for(const t of tables){
    const list=await api(`/api/${t}/list?q=${q}`);
    list.forEach(e=>all.push({...e,_table:t}));
  }
  $('#elist').innerHTML=all.length?all.map(e=>
    `<div class="item" data-id="${e.id}" data-table="${e._table}">
       <span class="nm">${e.canonical_name}</span>
       <span class="ty">${e._table}</span></div>`).join(''):'<div class="empty">該当無し</div>';
  document.querySelectorAll('#elist .item').forEach(it=>it.onclick=()=>{
    document.querySelectorAll('#elist .item').forEach(x=>x.classList.remove('on'));
    it.classList.add('on'); showEntity(it.dataset.table, it.dataset.id);
  });
}
$('#esearch').oninput=()=>loadEntities();

// 役割ラベル → 表示用 (矢印方向と日本語短文)
const ROLE_LABEL={
  employed_by:    {arrow:'→', text:'employed by'},
  employs:        {arrow:'→', text:'employs'},
  manufactures:   {arrow:'→', text:'manufactures'},
  manufactured_by:{arrow:'→', text:'manufactured by'},
  parent_of:      {arrow:'→', text:'parent of'},
  child_of:       {arrow:'→', text:'child of'},
  variant_of:     {arrow:'→', text:'variant of'},
  governed_by:    {arrow:'→', text:'governed by'},
  governs:        {arrow:'→', text:'governs'},
  complies_with:  {arrow:'→', text:'complies with'},
};

let _eCy=null;

function _claimRow(c){
  const conf=Math.max(0,Math.min(1,+c.confidence||0));
  const pct=Math.round(conf*100);
  const flag=c.status==='conflicted'?' <span class="flag" style="font-size:9px">CONFLICT</span>'
    :c.status==='superseded'?' <span class="flag" style="font-size:9px;color:var(--faint);border-color:var(--faint)">OLD</span>':'';
  return `<div class="claim-row">
    <span class="col">${esc(c.column_name)}</span>
    <span class="val" title="${esc(c.value||'')}">${esc(c.value||'')}${flag}</span>
    <span class="conf"><span class="track"><span class="fill" style="width:${pct}%"></span></span>
      <span class="v">${conf.toFixed(2)}</span></span>
    <span></span>
    <span class="src">${esc(c.doc_slug||'')}</span>
  </div>`;
}

function _relCard(r){
  const lab=ROLE_LABEL[r.role_label]||{arrow:'→',text:r.role_label||''};
  const otherIsEntity=!!r.other_table;
  const otherName=esc(r.other_canonical||'(?)');
  const otherClick=otherIsEntity
    ? `onclick="navEntity('${esc(r.other_table)}',${r.other_id})"`
    : '';
  const otherCls=otherIsEntity?'other':'other text';
  const attrs=Object.entries(r.attrs||{})
    .filter(([k,v])=>v!=null && v!=='')
    .map(([k,v])=>`<span class="badge"><span style="color:var(--faint)">${esc(k)}:</span> ${esc(v)}</span>`)
    .join('');
  const conf=(r.confidence!=null)?(+r.confidence).toFixed(2):'—';
  return `<div class="rcard">
    <span class="kindbg">${esc(r.kind)}</span>
    <span class="triple">
      <span class="role">${esc(lab.text)}</span>
      <span class="arrow">${lab.arrow}</span>
      <span class="${otherCls}" ${otherClick}>${otherName}</span>
    </span>
    <span class="attrs">${attrs}</span>
    <span class="meta"><span>conf ${conf}</span>${r.doc_slug?'<span>· '+esc(r.doc_slug)+'</span>':''}</span>
  </div>`;
}

function _groupRelations(rels){
  const groups={};
  rels.forEach(r=>{ (groups[r.kind] ||= []).push(r); });
  return Object.entries(groups);
}

function _renderEntGraph(table, eid, name, relations){
  const cyEl=document.getElementById('ecy');
  if(!cyEl) return;
  const centerId=`${table}:${eid}`;
  const nodes={};
  nodes[centerId]={data:{id:centerId,label:name,table:table,center:true}};
  const edges=[];
  relations.forEach((r,i)=>{
    if(!r.other_table) return;  // free-text 相手はグラフから除外 (compliance.standard_name 等)
    const nid=`${r.other_table}:${r.other_id}`;
    if(!nodes[nid]) nodes[nid]={data:{id:nid,label:r.other_canonical||'(?)',table:r.other_table}};
    edges.push({data:{id:'e'+i,source:centerId,target:nid,kind:r.kind}});
  });
  const els=[...Object.values(nodes), ...edges];
  const style=[
    {selector:'node',style:{
      'background-color':e=>WNODE_COLOR[e.data('table')]||'#7f8a78',
      'label':'data(label)','color':'#dfe6da','font-size':10,'font-family':'IBM Plex Mono',
      'text-outline-color':'#0a0c0a','text-outline-width':2,
      'text-valign':'bottom','text-margin-y':4,
      'width':18,'height':18,'border-width':1,'border-color':'#1f261f'}},
    {selector:'node[center]',style:{
      'width':28,'height':28,'border-width':2,'border-color':'#c4f24a','font-size':12,'font-weight':600}},
    {selector:'edge',style:{
      'curve-style':'bezier','line-color':'#3d4a26','target-arrow-color':'#3d4a26',
      'target-arrow-shape':'triangle','width':1.2,
      'label':'data(kind)','color':'#7f8a78','font-size':9,'font-family':'IBM Plex Mono',
      'text-rotation':'autorotate','text-margin-y':-6,
      'text-outline-color':'#0a0c0a','text-outline-width':1}},
  ];
  if(!_eCy || _eCy.container()!==cyEl){
    if(_eCy){ try{_eCy.destroy();}catch(_){} }
    _eCy=cytoscape({container:cyEl, elements:els, style,
      layout:{name:'concentric', animate:false, minNodeSpacing:30,
        concentric:n=>n.data('center')?2:1, levelWidth:()=>1},
      wheelSensitivity:0.25});
  } else {
    _eCy.elements().remove();
    _eCy.add(els);
    _eCy.style(style);
    _eCy.layout({name:'concentric', animate:false, minNodeSpacing:30,
      concentric:n=>n.data('center')?2:1, levelWidth:()=>1}).run();
  }
  _eCy.off('tap','node');
  _eCy.on('tap','node', evt=>{
    const n=evt.target.data();
    if(n.center) return;
    const [t,id]=n.id.split(':');
    navEntity(t, +id);
  });
}

function navEntity(table, id){
  // 別タイプの entity に飛ぶ場合: フィルタを更新し、リストを再描画してから show
  if(curType && curType!==table){
    curType=table;
    // チップ UI を更新
    document.querySelectorAll('#efilters .f').forEach(f=>{
      f.classList.toggle('on', f.dataset.t===table);
    });
    loadEntities().then(()=>showEntity(table, id));
  } else {
    showEntity(table, id);
  }
}

async function showEntity(table, id){
  const d=await api(`/api/${table}/${id}`);
  const claims=d.claims.length
    ? d.claims.map(_claimRow).join('')
    : '<div class="empty">—</div>';
  const groups=_groupRelations(d.relations||[]);
  const rel=groups.length
    ? groups.map(([kind,rs])=>`<div class="rgroup">${esc(kind)} (${rs.length})</div>${rs.map(_relCard).join('')}`).join('')
    : '<div class="empty">—</div>';
  const ment=(d.mentions||[]).map(m=>`<div class="row"><b>${esc(m.surface_form)}</b><span>${esc(m.doc_slug)}</span></div>`).join('')||'<div class="empty">—</div>';
  const hasGraph=(d.relations||[]).some(r=>r.other_table);
  $('#edetail').innerHTML=`<div class="title">${esc(d.entity.canonical_name)}</div>
    <div class="sub">${esc(table)} · #${d.entity.id} · alias: ${d.aliases.map(esc).join(' / ')||'—'}</div>
    <div class="sect">Claims (${d.claims.length})</div>${claims}
    <div class="sect">Relations (${(d.relations||[]).length})</div>${rel}
    ${hasGraph?`<div class="sect">Neighborhood</div><div id="ecy" class="ent-graph"></div>`:''}
    <div class="sect">Mentions (${(d.mentions||[]).length})</div>${ment}`;
  if(hasGraph){
    _renderEntGraph(table, d.entity.id, d.entity.canonical_name, d.relations);
  }
}

async function loadConflicts(){
  const groups=await api('/api/conflicts');
  if(!groups.length){$('#cflist').innerHTML='<div class="empty">矛盾は検出されていません</div>';return;}
  $('#cflist').innerHTML=groups.map(g=>
    `<div class="cfg"><div class="h">group ${g.group} · ${g.kind} · ${g.members.length} 件</div>`+
    g.members.map(m=>`<div class="m"><b>${esc(m.value!==undefined?m.value:'(existence)')}</b>
       <span style="color:var(--dim)">conf=${(+m.confidence).toFixed(2)} · ${m.status}</span>
       <span class="s">${m.doc_slug}</span></div>`).join('')+'</div>'
  ).join('');
}

// ----- Schema Proposals review -----
async function loadProposals(){
  const rows=await api('/api/proposals');
  if(!rows.length){$('#plist').innerHTML='<div class="empty">pending な proposal はありません</div>';return;}
  $('#plist').innerHTML=rows.map(p=>`
    <div class="cfg" id="p-${p.id}">
      <div class="h">#${p.id} · ${esc(p.kind)} · ${esc(p.target_table||'—')}${p.requires_manual_dry_run?' · MANUAL':''}</div>
      <div class="m"><span style="color:var(--dim)">${esc(p.rationale||'')}</span></div>
      <div id="pdiff-${p.id}" style="padding:0 15px">
        <div class="empty" style="padding:14px">validating…</div>
      </div>
      <div class="m"><details style="flex:1"><summary style="cursor:pointer;color:var(--dim);font-family:var(--mono);font-size:11px;letter-spacing:.08em">raw DDL</summary>
        <pre class="sql" style="margin:8px 0 0">${esc(p.proposed_ddl)}</pre></details></div>
      <div class="m">
        <button class="ghost" onclick="validateProposal(${p.id})">Re-validate</button>
        <button onclick="approveProposal(${p.id})">Approve</button>
        <button class="ghost" onclick="rejectProposal(${p.id})">Reject</button>
        <span id="presult-${p.id}" style="margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)"></span>
      </div>
    </div>`).join('');
  // 各行の validate を自動発火 (並列)
  rows.forEach(p=>validateProposal(p.id));
}

function _renderColDiff(cd, ddl){
  // cd: {"table:foo": {before_columns, after_columns, added, removed, kept, raw_before, raw_after}} | null
  if(!cd || !Object.keys(cd).length){
    return `<div class="m" style="background:var(--warn-bg)"><span class="flag">PARSE FAIL</span>
      <span style="color:var(--dim);margin-left:8px">列差分を抽出できません — raw DDL 参照</span></div>`;
  }
  const entries=Object.entries(cd);
  return entries.map(([key, d])=>{
    const tableName=key.replace(/^table:/,'');
    const renderCol=(c, flagHtml)=>`<div class="kv">
      <span class="k">${esc(c.name)}${c.pk?' <span class="flag col-kept" style="font-size:9px">PK</span>':''}${c.notnull?' <span class="flag col-kept" style="font-size:9px">NN</span>':''}</span>
      <span class="ty">${esc(c.type||'')}</span>${flagHtml||''}</div>`;
    const beforeBody=d.before_columns?
      d.before_columns.map(c=>{
        const removed=d.removed.includes(c.name);
        return renderCol(c, removed?'<span class="flag col-del">−</span>':'');
      }).join('') || '<div class="empty">列無し</div>'
      : '<div class="empty" style="font-style:italic">— 新規テーブル</div>';
    const afterBody=d.after_columns?
      d.after_columns.map(c=>{
        const added=d.added.includes(c.name);
        return renderCol(c, added?'<span class="flag col-add">+ NEW</span>':'');
      }).join('') || '<div class="empty">列無し</div>'
      : '<div class="empty" style="font-style:italic">— テーブル削除</div>';
    return `<div style="font-family:var(--mono);font-size:11px;color:var(--accent-dim);letter-spacing:.1em;padding:8px 0 0">${esc(tableName)}</div>
      <div class="diff2col">
        <div class="box"><h3>BEFORE${d.removed.length?' · '+d.removed.length+' removed':''}</h3>
          <div class="body col-list">${beforeBody}</div></div>
        <div class="box"><h3>AFTER${d.added.length?' · '+d.added.length+' new':''}</h3>
          <div class="body col-list">${afterBody}</div></div>
      </div>`;
  }).join('');
}

async function validateProposal(id){
  const r=await api(`/api/proposals/${id}/validate`);
  const status=$('#presult-'+id);
  const diffBox=$('#pdiff-'+id);
  if(!r.ast_ok){
    status.innerHTML='<span style="color:var(--warn)">AST FAIL: '+esc(r.ast_reason)+'</span>';
    diffBox.innerHTML='<div class="m" style="background:var(--warn-bg)"><span class="flag">AST FAIL</span><span style="color:var(--warn);margin-left:8px">'+esc(r.ast_reason)+'</span></div>';
    return;
  }
  if(!r.dry_ok){
    status.innerHTML='<span style="color:var(--warn)">DRY FAIL: '+esc(r.dry_reason)+'</span>';
    diffBox.innerHTML='<div class="m" style="background:var(--warn-bg)"><span class="flag">DRY FAIL</span><span style="color:var(--warn);margin-left:8px">'+esc(r.dry_reason)+'</span></div>';
    return;
  }
  status.innerHTML='<span style="color:#4dd28c">OK · diff: '+(r.diff||[]).length+' objects</span>';
  diffBox.innerHTML=_renderColDiff(r.column_diff, '');
}
async function approveProposal(id){
  const r=await fetch(`/api/proposals/${id}/approve`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'}).then(x=>x.json());
  const el=$('#presult-'+id);
  if(r.error){el.innerHTML='<span style="color:var(--warn)">'+esc(r.error)+': '+esc(r.reason||'')+'</span>';}
  else{el.innerHTML='<span style="color:#4dd28c">applied as migration '+r.applied_migration+'</span>';setTimeout(loadProposals,1200);}
}
async function rejectProposal(id){
  await fetch(`/api/proposals/${id}/reject`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});
  loadProposals();
}

// ----- Staging review -----
function _renderPayloadKv(raw){
  let obj;
  try{ obj=JSON.parse(raw); }
  catch(_){ return `<pre class="sql" style="margin:0">${esc(raw||'')}</pre>`; }
  if(obj===null || typeof obj!=='object'){
    return `<pre class="sql" style="margin:0">${esc(String(obj))}</pre>`;
  }
  return Object.entries(obj).map(([k,v])=>{
    const sv=(v && typeof v==='object')?JSON.stringify(v):String(v??'');
    const long=sv.includes('\n') || sv.length>80;
    if(long){
      return `<div style="margin:6px 0"><div style="font-family:var(--mono);font-size:11px;color:var(--dim)">${esc(k)}</div>
        <pre class="sql" style="margin:4px 0">${esc(sv)}</pre></div>`;
    }
    return `<div class="kv"><span class="k">${esc(k)}</span><span>${esc(sv)}</span></div>`;
  }).join('');
}

function _renderCandidates(stagingId, matches){
  if(!Array.isArray(matches)||!matches.length) return '';
  return matches.map((x,i)=>{
    const sim=Math.max(0, Math.min(1, Number(x.similarity)||0));
    const exact=!!x.norm_key_match;
    const pct=exact?100:Math.round(sim*100);
    const cls='bar sim'+(exact?' exact':'');
    const val=exact?'EXACT':sim.toFixed(2);
    const tbl=esc(x.table||'?');
    const nm=esc(x.canonical_name||'(no name)');
    return `<div class="${cls}">
      <span class="name"><span class="tbl">${tbl}:</span>${nm}</span>
      <span class="track" style="width:160px"><span class="fill" style="width:${pct}%"></span></span>
      <span class="v">${val}</span>
      <button class="ghost act" onclick="assignStaging(${stagingId}, '${tbl}')">Assign</button>
    </div>`;
  }).join('');
}

function _renderHints(matches){
  if(!Array.isArray(matches)||!matches.length) return '';
  return matches.map(x=>`<div class="row"><b>${esc(x.name||'')}</b>
    <span style="color:var(--dim)">(${esc(x.table||'?')})</span>
    <span>${esc(x.rationale||'')}</span></div>`).join('');
}

function _renderStagingRow(s){
  let m=null;
  if(s.match_summary){
    try{ m=JSON.parse(s.match_summary); }catch(_){}
  }
  const badges=[];
  if(m){
    badges.push(`<span class="badge">reason: ${esc(m.reason||'?')}</span>`);
    if(m.rule) badges.push(`<span class="badge">rule: ${esc(m.rule)}</span>`);
    if(m.column_name) badges.push(`<span class="badge">column: ${esc(m.column_name)}</span>`);
  }
  const candidates=m && Array.isArray(m.existing_matches) && m.existing_matches.length
    ? `<div class="box" style="margin-top:10px"><h3>Candidate matches (${m.existing_matches.length})</h3>
        <div class="body">${_renderCandidates(s.id, m.existing_matches)}</div></div>` : '';
  const hints=m && Array.isArray(m.llm_hints) && m.llm_hints.length
    ? `<div class="box" style="margin-top:10px"><h3>LLM hints</h3>
        <div class="body">${_renderHints(m.llm_hints)}</div></div>` : '';
  return `<div class="cfg">
    <div class="h">#${s.id} · proposed: ${esc(s.proposed_table||'—')} · ${esc(s.doc_slug||'')}</div>
    ${badges.length?`<div class="m">${badges.join(' ')}</div>`:''}
    <div class="m" style="display:block">
      <div class="box"><h3>Payload</h3><div class="body">${_renderPayloadKv(s.raw_payload)}</div></div>
      ${candidates}
      ${hints}
    </div>
    <div class="m">
      <button class="ghost" onclick="decideStagingPrompt(${s.id})">Assign to other table…</button>
      <button class="ghost" onclick="rejectStaging(${s.id})">Reject</button>
    </div>
  </div>`;
}

async function loadStaging(){
  const rows=await api('/api/staging');
  if(!rows.length){$('#slist').innerHTML='<div class="empty">pending な staging はありません</div>';return;}
  $('#slist').innerHTML=rows.map(_renderStagingRow).join('');
}
async function assignStaging(id, table){
  await fetch(`/api/staging/${id}/decide`,{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({decided_table: table})});
  loadStaging();
}
async function decideStagingPrompt(id){
  const table=prompt('decided_table (assign to):','');
  if(!table)return;
  await fetch(`/api/staging/${id}/decide`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decided_table:table})});
  loadStaging();
}
async function rejectStaging(id){
  await fetch(`/api/staging/${id}/reject`,{method:'POST'});
  loadStaging();
}

// ----- Weak Relations triage -----
const WNODE_COLOR={
  person:'#4dd28c', organization:'#5ec8ff', product:'#e0a64a',
  project:'#c4f24a', contract:'#c690ff', text:'#7f8a78',
};
let _wHeatmap=null, _wCy=null, _wSelected=null;

async function loadWeak(){
  $('#wlist').innerHTML=`
    <div class="box"><h3>Predicate × Subject→Object heatmap</h3>
      <div class="body"><div id="wheatmap" style="height:340px"></div>
        <div id="wempty" class="empty" style="display:none">weak_relations 未蓄積</div></div></div>
    <div class="box" style="margin-top:14px">
      <h3 id="wsubg-h">Subject-Object subgraph — (predicate を選択)</h3>
      <div class="body">
        <div id="wlegend" class="wnode-leg"></div>
        <div id="wcy" class="cy-canvas"></div>
        <div id="wpromote" style="margin-top:10px"></div>
        <div id="wrows" style="margin-top:6px"></div>
      </div></div>`;
  const matrix=await api('/api/weak_relations/matrix');
  if(!matrix.length){
    $('#wheatmap').style.display='none';
    $('#wempty').style.display='block';
    return;
  }
  // X 軸: subject_table → object_table の組
  const pairKey=r=>`${r.subject_table} → ${r.object_table}`;
  const pairTotals={};
  const predTotals={};
  matrix.forEach(r=>{
    const pk=pairKey(r);
    pairTotals[pk]=(pairTotals[pk]||0)+r.n;
    predTotals[r.predicate]=(predTotals[r.predicate]||0)+r.n;
  });
  const xs=Object.keys(pairTotals).sort((a,b)=>pairTotals[b]-pairTotals[a]);
  const ys=Object.keys(predTotals).sort((a,b)=>predTotals[b]-predTotals[a]);
  const xi=Object.fromEntries(xs.map((v,i)=>[v,i]));
  const yi=Object.fromEntries(ys.map((v,i)=>[v,i]));
  const data=matrix.map(r=>[xi[pairKey(r)], yi[r.predicate], r.n]);
  const maxN=Math.max(...matrix.map(r=>r.n));
  if(_wHeatmap){ _wHeatmap.dispose(); }
  _wHeatmap=echarts.init(document.getElementById('wheatmap'),null,{renderer:'canvas'});
  _wHeatmap.setOption({
    backgroundColor:'transparent',
    tooltip:{position:'top', formatter:p=>`<b>${ys[p.value[1]]}</b><br>${xs[p.value[0]]}<br>n=${p.value[2]}`},
    grid:{left:160,right:30,top:20,bottom:80,containLabel:false},
    xAxis:{type:'category',data:xs,splitArea:{show:true},
      axisLabel:{color:'#7f8a78',fontFamily:'IBM Plex Mono',fontSize:10,rotate:35,interval:0},
      axisLine:{lineStyle:{color:'#1f261f'}}, axisTick:{show:false}},
    yAxis:{type:'category',data:ys,splitArea:{show:true},
      axisLabel:{color:'#dfe6da',fontFamily:'IBM Plex Mono',fontSize:11,interval:0},
      axisLine:{lineStyle:{color:'#1f261f'}}, axisTick:{show:false}},
    visualMap:{min:0,max:maxN,calculable:true,orient:'horizontal',left:'center',bottom:10,
      textStyle:{color:'#7f8a78',fontFamily:'IBM Plex Mono',fontSize:10},
      inRange:{color:['#0e120e','#1f261f','#3d4a26','#7d9430','#c4f24a']}},
    series:[{type:'heatmap',data:data,
      label:{show:true,formatter:p=>p.value[2],color:'#0a0c0a',fontFamily:'IBM Plex Mono',fontSize:10},
      emphasis:{itemStyle:{shadowBlur:8,shadowColor:'rgba(196,242,74,.55)'}}}]
  });
  _wHeatmap.off('click');
  _wHeatmap.on('click', p=>{
    if(!p || !p.value) return;
    const pred=ys[p.value[1]];
    showWeakPredicate(pred);
  });
  // 起動時に上位 predicate を自動表示
  if(ys.length) showWeakPredicate(ys[0]);
}

async function showWeakPredicate(pred){
  _wSelected=pred;
  $('#wsubg-h').textContent='Subject-Object subgraph — '+pred;
  $('#wpromote').innerHTML=`<button onclick="promoteWeak('${esc(pred)}')">Promote "${esc(pred)}" to typed table</button>`;
  const rows=await api('/api/weak_relations?predicate='+encodeURIComponent(pred));
  // legend
  const usedTypes=new Set();
  rows.forEach(r=>{
    usedTypes.add(r.subject_table||'text');
    usedTypes.add(r.object_table||'text');
  });
  $('#wlegend').innerHTML=[...usedTypes].map(t=>
    `<span><i style="background:${WNODE_COLOR[t]||'#7f8a78'}"></i>${esc(t)}</span>`).join('');
  // build graph
  const nodes={}, edges=[];
  const nodeId=(table,id,fallback)=>{
    if(table && id!=null) return `${table}:${id}`;
    return 'text:'+(fallback||'').slice(0,40);
  };
  const upsert=(table,id,label)=>{
    const nid=nodeId(table,id,label);
    if(!nodes[nid]) nodes[nid]={data:{id:nid, label:label||'(?)', table:table||'text'}};
    return nid;
  };
  rows.forEach((r,i)=>{
    const sLabel=r.subject_canonical || `${r.subject_table}#${r.subject_id}`;
    const sId=upsert(r.subject_table, r.subject_id, sLabel);
    const oLabel=r.object_canonical || r.object_text || (r.object_table?`${r.object_table}#${r.object_id}`:'(?)');
    const oId=upsert(r.object_table, r.object_id, oLabel);
    edges.push({data:{id:'e'+i+'-'+r.id, source:sId, target:oId, predicate:pred,
      confidence:r.confidence}});
  });
  const els=[...Object.values(nodes), ...edges];
  if(!_wCy){
    _wCy=cytoscape({
      container:document.getElementById('wcy'),
      elements:els,
      style:[
        {selector:'node',style:{
          'background-color':e=>WNODE_COLOR[e.data('table')]||'#7f8a78',
          'label':'data(label)','color':'#dfe6da','font-size':11,'font-family':'IBM Plex Mono',
          'text-outline-color':'#0a0c0a','text-outline-width':2,
          'text-valign':'bottom','text-margin-y':4,
          'width':22,'height':22,'border-width':1,'border-color':'#1f261f'}},
        {selector:'edge',style:{
          'curve-style':'bezier','line-color':'#3d4a26','target-arrow-color':'#3d4a26',
          'target-arrow-shape':'triangle','width':1.4,
          'label':'data(predicate)','color':'#7f8a78','font-size':9,'font-family':'IBM Plex Mono',
          'text-rotation':'autorotate','text-margin-y':-6,'text-outline-color':'#0a0c0a','text-outline-width':1}},
      ],
      layout:{name:'cose', animate:false, idealEdgeLength:90, nodeRepulsion:6000},
      wheelSensitivity:0.25,
    });
  } else {
    _wCy.elements().remove();
    _wCy.add(els);
    _wCy.layout({name:'cose', animate:false, idealEdgeLength:90, nodeRepulsion:6000}).run();
  }
  // row list
  $('#wrows').innerHTML=rows.length?rows.map(r=>{
    const sLabel=r.subject_canonical || `${r.subject_table}#${r.subject_id}`;
    const oLabel=r.object_canonical || r.object_text || (r.object_table?`${r.object_table}#${r.object_id}`:'(?)');
    const conf=(r.confidence!=null)?(+r.confidence).toFixed(2):'—';
    return `<div class="wrow">
      <div class="triple"><b>${esc(sLabel)}</b><span class="pred">→ ${esc(pred)} →</span><b>${esc(oLabel)}</b></div>
      <div class="doc">${esc(r.doc_slug||'')}</div>
      <div class="conf">conf ${conf}</div>
    </div>`;
  }).join(''):'<div class="empty">行無し</div>';
}

async function promoteWeak(predicate){
  if(!confirm('promote "'+predicate+'" to schema_proposal?'))return;
  await fetch('/api/weak_relations/promote',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({predicate})});
  loadWeak();
}

$('#run').onclick=async()=>{
  const q=$('#q').value.trim(); if(!q)return;
  $('#askout').innerHTML='<div class="empty">問い合わせ中…（要約/抽出/回答に時間がかかる場合があります）</div>';
  let r;
  try{ r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({question:q})}).then(x=>x.json()); }
  catch(e){ $('#askout').innerHTML='<div class="err">サーバ通信失敗</div>'; return; }
  let h='';
  if(r.error) h+=`<div class="err">⚠ ${r.error}</div>`;
  h+=`<div class="meta"><span class="badge">rows: ${(r.rows||[]).length}</span>`+
     `<span class="badge">docs: ${(r.docs||[]).length}</span></div>`;
  h+=`<div class="ans">${(r.answer||'(回答生成不可 — Ollama 未起動の可能性)').replace(/</g,'&lt;')}</div>`;
  if(r.sql) h+=`<div class="sect">生成 SQL（read-only 検証済）</div><pre class="sql">${r.sql.replace(/</g,'&lt;')}</pre>`;
  if(r.rows&&r.rows.length){const k=Object.keys(r.rows[0]);
    h+='<div class="sect">構造化結果</div><table><tr>'+k.map(x=>`<th>${x}</th>`).join('')+'</tr>'+
      r.rows.slice(0,40).map(row=>'<tr>'+k.map(x=>`<td>${String(row[x]??'')}</td>`).join('')+'</tr>').join('')+'</table>';}
  if(r.docs&&r.docs.length){h+='<div class="sect">関連文書</div>'+
    r.docs.map(d=>`<div class="row"><b>${d.slug}</b><span>${(d.snippet||'').replace(/</g,'&lt;')}</span></div>`).join('');}
  $('#askout').innerHTML=h;
};

// ===== Eval =====
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let evRuns=[], evStage='all', evSelected=null;

function gloss(term, label){
  // term が glossary に無ければ素の text を返す (副作用ゼロ)
  if(!(term in GLOSSARY)) return esc(label==null?term:label);
  return `<span class="gloss" data-term="${esc(term)}">${esc(label==null?term:label)}</span>`;
}

document.body.insertAdjacentHTML('beforeend','<div id="glosstip"></div>');
(function(){
  const tip=document.getElementById('glosstip');
  let pinned=false;
  function show(el){
    const term=el.dataset.term, text=GLOSSARY[term];
    if(!text) return;
    tip.innerHTML=`<b>${esc(term)}</b>${esc(text)}${pinned?'<span class="pin">クリックで閉じる</span>':''}`;
    const r=el.getBoundingClientRect();
    const w=Math.min(380,window.innerWidth-20);
    let left=r.left, top=r.bottom+6;
    if(left+w>window.innerWidth-8) left=window.innerWidth-w-8;
    tip.style.left=left+'px'; tip.style.top=top+'px'; tip.style.maxWidth=w+'px';
    tip.style.display='block';
  }
  function hide(){ tip.style.display='none'; pinned=false; tip.classList.remove('pinned'); }
  document.addEventListener('mouseover',e=>{
    if(pinned) return;
    const el=e.target.closest('.gloss'); if(el) show(el);
  });
  document.addEventListener('mouseout',e=>{
    if(pinned) return;
    if(e.target.closest('.gloss')) tip.style.display='none';
  });
  document.addEventListener('click',e=>{
    const el=e.target.closest('.gloss');
    if(el){
      e.stopPropagation();
      if(pinned){ hide(); } else { pinned=true; tip.classList.add('pinned'); show(el); }
    } else if(pinned && !e.target.closest('#glosstip')){
      hide();
    }
  });
  window.addEventListener('scroll',()=>{ if(!pinned) hide(); },true);
})();

async function loadEvalRuns(){
  evRuns=await api('/api/eval/runs');
  const stages=['all','extract','dedup','query','proposal'];
  $('#evfilters').innerHTML=stages.map(s=>
    `<span class="f ${s===evStage?'on':''}" data-s="${s}">${s}</span>`).join('');
  document.querySelectorAll('#evfilters .f').forEach(f=>f.onclick=()=>{
    evStage=f.dataset.s; renderEvalList();
  });
  $('#evsearch').oninput=()=>renderEvalList();
  renderEvalList();
}

function renderEvalList(){
  const q=($('#evsearch').value||'').toLowerCase();
  const goldOf=m=>((m.gold_path||'').split(/[\\/]/).pop()||'').replace(/\.ya?ml$/,'');
  const rows=evRuns.filter(r=>{
    if(r.error) return false;
    const m=r.meta||{};
    const st=m.stage||'';
    if(evStage!=='all' && st!==evStage) return false;
    if(!q) return true;
    const blob=`${m.model||''} ${m.tag||''} ${goldOf(m)}`.toLowerCase();
    return blob.includes(q);
  });
  if(!rows.length){ $('#evlist').innerHTML='<div class="empty">該当 run 無し</div>'; return; }
  $('#evlist').innerHTML=rows.map(r=>{
    const m=r.meta||{};
    const ts=(m.timestamp_utc||'').replace('T',' ').replace(/-(\d\d)-(\d\d)Z$/,':$1:$2Z').slice(0,19);
    const gold=goldOf(m);
    const score=(typeof r.score==='number')?r.score:null;
    const scoreCls=score==null?'s-na':(score>=0.9?'s-good':(score>=0.7?'s-ok':(score>=0.5?'s-warn':'s-bad')));
    const sval=score==null?'—':score.toFixed(2);
    const hl=Object.entries(r.headline||{}).map(([k,v])=>
      `<span>${gloss(k)} <b>${(typeof v==='number')?v.toFixed(2):'—'}</b></span>`
    ).join('');
    const cur=evSelected===r.filename?' on':'';
    return `<div class="item ${scoreCls}${cur}" data-f="${esc(r.filename)}">
      <div style="flex:1;min-width:0">
        <div>
          <span class="sg">${esc(m.stage||'?')}</span><span class="tg">${esc(m.tag||'-')}</span>
          <span class="md" style="margin-left:8px">${esc(m.model||'')}</span>
          <span class="gd">gold: <b>${esc(gold||'-')}</b></span>
        </div>
        <div class="ts">${esc(ts)}</div>
        <div class="hl">${hl}</div>
      </div>
      <div class="scorebox">${gloss('score','score')} <span class="sval">${sval}</span></div>
    </div>`;
  }).join('');
  document.querySelectorAll('#evlist .item').forEach(it=>it.onclick=()=>{
    evSelected=it.dataset.f;
    document.querySelectorAll('#evlist .item').forEach(x=>x.classList.remove('on'));
    it.classList.add('on');
    showEvalRun(it.dataset.f);
  });
}

let _evTrendChart=null, _evRadarChart=null, _evCaseChart=null;

function _evGoldOf(m){ return ((m.gold_path||'').split(/[\\/]/).pop()||'').replace(/\.ya?ml$/,''); }

function _drawTrendChart(stage, goldName){
  const el=document.getElementById('ev-trend');
  if(!el) return;
  const matched=evRuns
    .filter(r=>!r.error && r.meta && r.meta.stage===stage
      && _evGoldOf(r.meta)===goldName && typeof r.score==='number')
    .sort((a,b)=>(a.meta.timestamp_utc||'').localeCompare(b.meta.timestamp_utc||''))
    .slice(-30);
  if(matched.length<2){
    el.innerHTML='<div class="empty" style="padding:50px 0">同条件 (stage + gold) の過去 run が 2 件未満のため trend 表示なし</div>';
    return;
  }
  if(_evTrendChart){ _evTrendChart.dispose(); }
  _evTrendChart=echarts.init(el,null,{renderer:'canvas'});
  const points=matched.map(r=>({
    value:[(r.meta.timestamp_utc||'').slice(0,19).replace('T',' '), r.score],
    filename:r.filename, tag:r.meta.tag||'', score:r.score,
  }));
  _evTrendChart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'item', formatter:p=>
      `<b>${p.data.tag||'-'}</b><br>${p.data.value[0]}<br>score=${(+p.data.score).toFixed(3)}`},
    grid:{left:40,right:18,top:22,bottom:46,containLabel:true},
    xAxis:{type:'category', data:points.map(p=>p.value[0]),
      axisLabel:{color:'#7f8a78',fontFamily:'IBM Plex Mono',fontSize:9,rotate:25,
        interval:Math.max(0,Math.floor(points.length/8))},
      axisLine:{lineStyle:{color:'#1f261f'}}, axisTick:{show:false}},
    yAxis:{type:'value', min:0, max:1,
      axisLabel:{color:'#7f8a78',fontFamily:'IBM Plex Mono',fontSize:10,formatter:v=>v.toFixed(1)},
      splitLine:{lineStyle:{color:'#1f261f'}},
      axisLine:{lineStyle:{color:'#1f261f'}}},
    series:[{
      type:'line', smooth:false, symbolSize:8,
      lineStyle:{color:'#7d9430', width:1.5},
      itemStyle:{color:p=>{const v=p.data.score;
        return v>=0.9?'#4dd28c':v>=0.7?'#c4f24a':v>=0.5?'#e0a64a':'#ff5468';}},
      data:points,
    }],
  });
  _evTrendChart.off('click');
  _evTrendChart.on('click', p=>{
    const fn=p.data && p.data.filename;
    if(!fn) return;
    evSelected=fn;
    document.querySelectorAll('#evlist .item').forEach(it=>
      it.classList.toggle('on', it.dataset.f===fn));
    showEvalRun(fn);
  });
}

function _drawRadar(stage, agg){
  const el=document.getElementById('ev-radar');
  if(!el) return;
  let keys=[];
  if(stage==='dedup'){
    keys=['accuracy','precision','recall','f1','level_match_rate'];
  } else if(stage==='extract'){
    keys=['entities_precision','entities_recall','entities_f1',
          'relations_precision','relations_recall','relations_f1',
          'facts_precision','facts_recall','facts_f1'];
  } else if(stage==='query'){
    keys=['sql_success_rate','row_contains_rate','doc_slug_rate'];
  } else {
    keys=Object.keys(agg).filter(k=>k.endsWith('_mean')).map(k=>k.slice(0,-5)).slice(0,9);
  }
  keys=keys.filter(k=>typeof agg[k+'_mean']==='number');
  if(keys.length<3){
    el.innerHTML='<div class="empty" style="padding:60px 0">radar には 3 メトリクス必要</div>';
    return;
  }
  if(_evRadarChart){ _evRadarChart.dispose(); }
  _evRadarChart=echarts.init(el,null,{renderer:'canvas'});
  _evRadarChart.setOption({
    backgroundColor:'transparent',
    tooltip:{trigger:'item'},
    radar:{indicator:keys.map(k=>({name:k,max:1})), splitNumber:4, shape:'polygon',
      center:['50%','55%'], radius:'68%',
      name:{textStyle:{color:'#dfe6da',fontFamily:'IBM Plex Mono',fontSize:9}},
      splitLine:{lineStyle:{color:'#1f261f'}},
      splitArea:{areaStyle:{color:['rgba(15,17,15,0.4)','rgba(20,24,20,0.4)']}},
      axisLine:{lineStyle:{color:'#1f261f'}}},
    series:[{type:'radar', data:[{
      value:keys.map(k=>Math.max(0,Math.min(1,+agg[k+'_mean']||0))), name:'mean',
      areaStyle:{color:'rgba(196,242,74,0.18)'},
      lineStyle:{color:'#c4f24a',width:1.5},
      itemStyle:{color:'#c4f24a'}}]}]
  });
}

function _drawCaseChart(stage, cases, correct){
  const el=document.getElementById('ev-cases-chart');
  if(!el) return;
  if(!cases.length && !correct){ el.style.display='none'; return; }
  if(_evCaseChart){ _evCaseChart.dispose(); }
  _evCaseChart=echarts.init(el,null,{renderer:'canvas'});
  let opt=null;
  if(stage==='extract'){
    const bucket={};
    cases.forEach(c=>{
      const cat=c.category||'other';
      bucket[cat]=bucket[cat]||{missed:0, extra:0};
      if(c.kind==='missed') bucket[cat].missed++;
      else if(c.kind==='extra') bucket[cat].extra++;
    });
    // correct があれば bucket をマージ
    const cats=correct
      ? ['entities','relations','facts']
      : Object.keys(bucket);
    cats.forEach(c=>{ bucket[c]=bucket[c]||{missed:0, extra:0}; });
    opt={
      backgroundColor:'transparent',
      tooltip:{trigger:'axis', axisPointer:{type:'shadow'}},
      legend:{textStyle:{color:'#7f8a78',fontFamily:'IBM Plex Mono',fontSize:10},top:4,right:10},
      grid:{left:24,right:18,top:30,bottom:24,containLabel:true},
      xAxis:{type:'category', data:cats,
        axisLabel:{color:'#7f8a78',fontFamily:'IBM Plex Mono',fontSize:10},
        axisLine:{lineStyle:{color:'#1f261f'}}, axisTick:{show:false}},
      yAxis:{type:'value', minInterval:1,
        axisLabel:{color:'#7f8a78',fontFamily:'IBM Plex Mono',fontSize:10},
        splitLine:{lineStyle:{color:'#1f261f'}}, axisLine:{lineStyle:{color:'#1f261f'}}},
      series:[
        ...(correct?[{name:'correct', type:'bar', stack:'x', itemStyle:{color:'#4dd28c'},
          data:cats.map(c=>(correct[c]&&correct[c].correct.length)||0)}]:[]),
        {name:'missed', type:'bar', stack:'x', itemStyle:{color:'#ff5468'},
          data:cats.map(c=>bucket[c].missed)},
        {name:'extra', type:'bar', stack:'x', itemStyle:{color:'#e0a64a'},
          data:cats.map(c=>bucket[c].extra)},
      ],
    };
  } else if(stage==='dedup'){
    let correct=0, incorrect=0;
    cases.forEach(c=>{ if(c.correct) correct++; else incorrect++; });
    opt={
      backgroundColor:'transparent',
      tooltip:{trigger:'item'},
      legend:{textStyle:{color:'#7f8a78',fontFamily:'IBM Plex Mono',fontSize:10},
        top:'center',right:10,orient:'vertical'},
      series:[{type:'pie', radius:['40%','72%'], center:['38%','55%'],
        label:{color:'#dfe6da',fontFamily:'IBM Plex Mono',fontSize:10,
          formatter:'{b}\n{c}'},
        data:[
          {value:correct, name:'correct', itemStyle:{color:'#4dd28c'}},
          {value:incorrect, name:'incorrect', itemStyle:{color:'#ff5468'}},
        ]}]
    };
  } else if(stage==='query'){
    const tot=cases.length;
    const sqlOk=cases.filter(c=>c.sql_ok===true).length/Math.max(1,tot);
    const rowAvg=cases.map(c=>c.row_contains_rate||0).reduce((a,b)=>a+b,0)/Math.max(1,tot);
    const docAvg=cases.map(c=>c.doc_slug_rate||0).reduce((a,b)=>a+b,0)/Math.max(1,tot);
    opt={
      backgroundColor:'transparent',
      tooltip:{trigger:'axis', axisPointer:{type:'shadow'}, valueFormatter:v=>(+v).toFixed(2)},
      grid:{left:24,right:24,top:22,bottom:24,containLabel:true},
      xAxis:{type:'category', data:['sql_ok','row_contains','doc_slug'],
        axisLabel:{color:'#7f8a78',fontFamily:'IBM Plex Mono',fontSize:10},
        axisLine:{lineStyle:{color:'#1f261f'}}, axisTick:{show:false}},
      yAxis:{type:'value', min:0, max:1,
        axisLabel:{color:'#7f8a78',fontFamily:'IBM Plex Mono',fontSize:10},
        splitLine:{lineStyle:{color:'#1f261f'}}, axisLine:{lineStyle:{color:'#1f261f'}}},
      series:[{type:'bar', data:[sqlOk, rowAvg, docAvg], itemStyle:{color:'#7d9430'},
        label:{show:true,position:'top',color:'#dfe6da',fontFamily:'IBM Plex Mono',
          fontSize:10,formatter:p=>p.value.toFixed(2)}}],
    };
  } else {
    el.style.display='none';
    return;
  }
  _evCaseChart.setOption(opt);
}

// tools/normalize.py:normalize と等価 (relation/fact のキー比較用)
const _STRIP_TOKENS=['株式会社','有限会社','合同会社','（株）','(株)','㈱',
  'corporation','inc.','inc','corp.','corp','co.','co','ltd.','ltd','llc','k.k.','kk']
  .sort((a,b)=>b.length-a.length);
function _norm(s){
  let v=String(s||'').normalize('NFKC').toLowerCase().trim();
  for(const t of _STRIP_TOKENS){ v=v.split(t.toLowerCase()).join(''); }
  return v.replace(/[\s　_,.\-・()（）]+/g,'');
}

function _computeCorrectExtract(gold, cases){
  // missed の集合 (run をまたいで union)。matchers.py に従い relations/facts は normalize 済キー.
  const ent=new Set(), rel=new Set(), fact=new Set();
  cases.forEach(c=>{
    if(c.kind!=='missed') return;
    if(c.category==='entities')  ent.add(c.canonical_name);
    if(c.category==='relations') rel.add(`${c.proposed_junction}|${c.from}|${c.to}`);
    if(c.category==='facts')     fact.add(`${c.entity}|${c.column}|${c.value}`);
  });
  const out={entities:{correct:[],total:0}, relations:{correct:[],total:0}, facts:{correct:[],total:0}};
  (gold.entities||[]).forEach(e=>{
    out.entities.total++;
    if(!ent.has(e.canonical_name))
      out.entities.correct.push({name:e.canonical_name, type:e.proposed_type});
  });
  (gold.relations||[]).forEach(r=>{
    out.relations.total++;
    const key=`${r.proposed_junction}|${_norm(r.from)}|${_norm(r.to)}`;
    if(!rel.has(key))
      out.relations.correct.push({junction:r.proposed_junction, from:r.from, to:r.to});
  });
  (gold.entities||[]).forEach(e=>{
    Object.entries(e.attributes||{}).forEach(([col,val])=>{
      if(val==null || val==='') return;
      out.facts.total++;
      const key=`${_norm(e.canonical_name)}|${col}|${_norm(val)}`;
      if(!fact.has(key))
        out.facts.correct.push({entity:e.canonical_name, column:col, value:String(val)});
    });
  });
  return out;
}

function _renderCorrectSection(c){
  const sect=(label, items, fmt)=>!items.length?'':`
    <details style="margin:4px 0"><summary style="cursor:pointer;font-family:var(--mono);font-size:11px;color:#4dd28c">✓ ${esc(label)} (${items.length})</summary>
    <div style="padding:6px 12px;border-left:2px solid #4dd28c;background:rgba(77,210,140,.05);margin:4px 0">
    ${items.map(fmt).join('')}</div></details>`;
  const totals=`<div style="font-family:var(--mono);font-size:11px;color:var(--dim);margin:8px 0 4px">
    correct / total — entities <b style="color:#4dd28c">${c.entities.correct.length}/${c.entities.total}</b>
    · relations <b style="color:#4dd28c">${c.relations.correct.length}/${c.relations.total}</b>
    · facts <b style="color:#4dd28c">${c.facts.correct.length}/${c.facts.total}</b>
    <span style="color:var(--faint);margin-left:6px">(全 run で 1 度も missed されなかった項目)</span></div>`;
  return totals
    + sect('entities correct', c.entities.correct, x=>
        `<div class="row"><b>${esc(x.name)}</b><span>${esc(x.type||'')}</span></div>`)
    + sect('relations correct', c.relations.correct, x=>
        `<div class="row"><b>${esc(x.from)} → ${esc(x.junction)} → ${esc(x.to)}</b><span></span></div>`)
    + sect('facts correct', c.facts.correct, x=>
        `<div class="row"><b>${esc(x.entity)}.${esc(x.column)}</b><span>${esc(x.value)}</span></div>`);
}

async function showEvalRun(filename){
  const data=await api('/api/eval/run/'+encodeURIComponent(filename));
  if(data.error){ $('#evdetail').innerHTML=`<div class="err">${esc(data.error)}</div>`; return; }
  const m=data.meta||{}, res=data.result||{};
  const gs=res.gold_summary||{}, agg=res.aggregate||{}, cases=res.per_case||[];
  const stage=m.stage||'unknown';

  const goldName=_evGoldOf(m);
  const goldBase=(m.gold_path||'').split(/[\\/]/).pop()||'';
  // extract のみ gold YAML を取得 (correct 集合の導出に使用)
  let goldData=null, correct=null;
  if(stage==='extract' && goldBase){
    try{
      goldData=await api(`/api/eval/gold/${encodeURIComponent(stage)}/${encodeURIComponent(goldBase)}`);
      if(goldData && !goldData.error) correct=_computeCorrectExtract(goldData, cases);
    }catch(_){}
  }
  const gitShort=(m.git_rev||'').slice(0,7);
  const chips=[
    ['stage',stage],['tag',m.tag],['model',m.model],['runs',m.runs],
    ['git',gitShort],['t',m.timestamp_utc],['gold',goldName]
  ].map(([k,v])=>`<span class="chip">${esc(k)} <b>${esc(v??'-')}</b></span>`).join('');

  const goldRow=Object.entries(gs).map(([k,v])=>
    `<div class="row"><b>${esc(k)}</b><span>${esc(typeof v==='object'?JSON.stringify(v):v)}</span></div>`
  ).join('')||'<div class="empty">—</div>';

  const aggHtml=renderAggregate(stage, agg);
  const caseHtml=renderCases(stage, cases);
  const perRunTraces=(res.per_run||[]).filter(r=>r && r.trace && r.trace.length);
  let runTraceHtml='';
  if(perRunTraces.length){
    runTraceHtml='<div class="sect">Per-run trace</div>'+perRunTraces.map(r=>
      `<details style="margin:6px 0"><summary class="dim" style="font-family:var(--mono);font-size:11px;cursor:pointer">run ${esc(r.run)} · ${r.trace.length} steps</summary>${renderTrace(r.trace)}</details>`
    ).join('');
  }

  $('#evdetail').innerHTML=
    `<div class="ev-meta">${chips}</div>
     <div class="sect">Trend (this stage × gold)</div>
     <div id="ev-trend" class="ev-chart-wide"></div>
     <div class="sect">Gold summary</div>${goldRow}
     <div class="sect">Aggregate</div>
     <div class="ev-charts">
       <div id="ev-radar" class="ev-chart"></div>
       <div class="ev-chart" style="padding:10px 14px;overflow:auto">${aggHtml}</div>
     </div>
     ${runTraceHtml}
     <div class="sect">Per-case (${cases.length})</div>
     <div id="ev-cases-chart" class="ev-chart-wide"></div>
     ${correct?_renderCorrectSection(correct):''}
     ${caseHtml}`;

  _drawTrendChart(stage, goldName);
  _drawRadar(stage, agg);
  _drawCaseChart(stage, cases, correct);

  // 行クリックで詳細展開: trace タイムライン + raw JSON (折りたたみ)
  document.querySelectorAll('#evdetail tr.case').forEach(tr=>tr.onclick=()=>{
    const next=tr.nextElementSibling;
    if(next && next.classList.contains('detail')){ next.remove(); return; }
    const obj=JSON.parse(tr.dataset.json);
    const cols=tr.parentElement.querySelector('tr').children.length;
    const det=document.createElement('tr');
    det.className='detail';
    const traceHtml=renderTrace(obj.trace);
    const rawHtml=`<details><summary class="dim" style="font-family:var(--mono);font-size:10.5px;color:var(--dim);cursor:pointer;margin-top:12px">raw json</summary><pre>${esc(JSON.stringify(obj,null,2))}</pre></details>`;
    det.innerHTML=`<td colspan="${cols}"><div class="sect" style="margin:0 0 6px">Trace (${(obj.trace||[]).length} steps)</div>${traceHtml}${rawHtml}</td>`;
    tr.after(det);
  });
}

function renderTrace(trace){
  if(!trace || !trace.length) return '<div class="empty">trace 無し（古い run か、その経路で LLM/note が走らなかった）</div>';
  // 旧 run 互換: 廃止された route.* ステップは表示しない。
  const filtered=trace.filter(e=>!String(e.kind||'').startsWith('route.'));
  if(!filtered.length) return '<div class="empty">trace 無し</div>';
  const maxMs=Math.max(1, ...filtered.map(e=>+e.elapsed_ms||0));
  return '<div class="trace">'+filtered.map(e=>renderStep(e,maxMs)).join('')+'</div>';
}

function renderStep(e, maxMs){
  const kind=e.kind||'step';
  const isLLM=kind.startsWith('llm.');
  const hasErr=!!e.error;
  const cls=hasErr?'err':(isLLM?'llm':'');
  let elapsed='';
  if(e.elapsed_ms!=null){
    const w=Math.max(2, Math.round((+e.elapsed_ms)/(maxMs||1)*120));
    elapsed=`<span class="dim">${e.elapsed_ms}ms</span><span class="timebar" style="width:${w}px"></span>`;
  }
  const skip=new Set(['kind','t_ms','prompt','response','elapsed_ms']);
  // 「長い / 複数行」の値は inline の dim ではなく pre ブロックに分離して表示
  const inlineParts=[], blockParts=[];
  for(const [k,v] of Object.entries(e)){
    if(skip.has(k)) continue;
    const sv=(v==null)?'':(typeof v==='object'?JSON.stringify(v,null,2):String(v));
    if(sv.includes('\n') || sv.length>80){
      blockParts.push(`<b>${esc(k)}</b><pre>${esc(sv)}</pre>`);
    } else {
      inlineParts.push(`<span class="dim">${esc(k)}=${esc(sv)}</span>`);
    }
  }
  const meta=inlineParts.join(' ');
  const blocks=blockParts.length?`<div class="step-blocks">${blockParts.join('')}</div>`:'';
  let llmBody='';
  if(isLLM && (e.prompt||e.response)){
    llmBody=`<details><summary>prompt / response</summary>
      <b>prompt</b><pre>${esc(e.prompt||'')}</pre>
      <b>response</b><pre>${esc(e.response==null?'(なし)':e.response)}</pre>
    </details>`;
  }
  return `<div class="step ${cls}"><span class="kind">${gloss(kind)}</span> ${elapsed} ${meta}${blocks}${llmBody}</div>`;
}

function bar(name, mean, std){
  const v=Number(mean||0), s=Number(std||0);
  const pct=Math.max(0,Math.min(100, v*100));
  const sd=s?` ± ${s.toFixed(3)}`:'';
  return `<div class="bar"><span class="name">${gloss(name)}</span>
    <span class="track"><span class="fill" style="width:${pct}%"></span></span>
    <span class="v">${v.toFixed(3)}${sd}</span></div>`;
}

function renderAggregate(stage, agg){
  const pick=(k)=>[agg[k+'_mean'], agg[k+'_std']];
  let keys=[];
  if(stage==='query'){
    keys=['sql_success_rate','row_contains_rate','doc_slug_rate'];
  } else if(stage==='dedup'){
    keys=['accuracy','precision','recall','f1','level_match_rate'];
  } else if(stage==='extract'){
    keys=[];
    for(const cat of ['entities','relations','facts'])
      for(const m of ['precision','recall','f1']) keys.push(`${cat}_${m}`);
  } else {
    // 未知 stage は *_mean を機械的に拾う
    keys=Object.keys(agg).filter(k=>k.endsWith('_mean')).map(k=>k.slice(0,-5));
  }
  if(!keys.length) return '<div class="empty">aggregate 無し</div>';
  return keys.map(k=>{const [mn,sd]=pick(k); return bar(k,mn,sd);}).join('');
}

function renderCases(stage, cases){
  if(!cases.length) return '<div class="empty">失敗ケース無し</div>';
  if(stage==='query') return renderCasesQuery(cases);
  if(stage==='extract') return renderCasesExtract(cases);
  if(stage==='dedup') return renderCasesDedup(cases);
  // fallback: label + raw json
  const rows=cases.map(c=>`<tr class="case" data-json="${esc(JSON.stringify(c))}">
    <td>${esc(c.label||'-')}</td></tr>`).join('');
  return `<table><tr><th>label</th></tr>${rows}</table>`;
}

function renderCasesQuery(cases){
  const rows=cases.map(c=>{
    const bad=c.sql_ok===false || c.error || (c.missed_contains||[]).length || (c.missed_slugs||[]).length;
    const sqlOk=c.sql_ok===true?'ok':(c.sql_ok===false?'NG':'-');
    const row=c.row_contains_rate==null?'-':(c.row_contains_rate).toFixed(2);
    const miss=(c.missed_contains||[]).map(x=>`${esc(x.column)}=${esc(x.value)}`).join(' / ');
    return `<tr class="case ${bad?'bad':''}" data-json="${esc(JSON.stringify(c))}">
      <td>${esc(c.label||'-')}</td>
      <td>${sqlOk}</td>
      <td>${row}</td>
      <td>${esc(miss)}</td>
      <td>${esc(c.error||'-')}</td>
    </tr>`;
  }).join('');
  return `<table><tr>
    <th>label</th><th>sql</th><th>row%</th>
    <th>missed_contains</th><th>error</th></tr>${rows}</table>`;
}

function renderCasesExtract(cases){
  const rows=cases.map(c=>{
    const item={...c}; delete item.label; delete item.category; delete item.kind;
    return `<tr class="case ${c.kind==='missed'?'bad':''}" data-json="${esc(JSON.stringify(c))}">
      <td>${esc(c.category||'-')}</td>
      <td>${c.kind?gloss(c.kind):'-'}</td>
      <td>${esc(JSON.stringify(item))}</td>
    </tr>`;
  }).join('');
  return `<table><tr><th>category</th><th>kind</th><th>item</th></tr>${rows}</table>`;
}

function renderCasesDedup(cases){
  const rows=cases.map(c=>{
    const bad=!c.correct;
    const lvl=c.level_match===true?'ok':(c.level_match===false?'NG':'-');
    return `<tr class="case ${bad?'bad':''}" data-json="${esc(JSON.stringify(c))}">
      <td>${esc(c.a)} ↔ ${esc(c.b)}</td>
      <td>${esc(c.expected||'-')} / ${esc(c.predicted||'-')}</td>
      <td>${c.how_a?gloss(c.how_a):'-'} / ${c.how_b?gloss(c.how_b):'-'}</td>
      <td>${lvl}</td>
    </tr>`;
  }).join('');
  return `<table><tr><th>a ↔ b</th><th>expected / predicted</th>
    <th>${gloss('how_a')} / ${gloss('how_b')}</th><th>${gloss('lvl','level')}</th></tr>${rows}</table>`;
}
