# Typed-schema dedup gold。table 列を追加 (型別 norm_key/aliases 表に対する突合)。
schema_version: 2

pairs:
  # === exact (型別 norm_key 一致) ===
  - {a: "アクメ株式会社", b: "アクメ（株）",   table: organization, expected: same, level: exact}
  - {a: "アクメ株式会社", b: "アクメ",          table: organization, expected: same, level: exact}
  - {a: "アクメ株式会社", b: "Acme Inc.",       table: organization, expected: same, level: alias-or-llm}
  - {a: "山田 太郎",       b: "山田太郎",       table: person,       expected: same, level: exact}
  - {a: "鈴木 花子",       b: "鈴木花子",       table: person,       expected: same, level: exact}
  - {a: "SmartScan",       b: "Smart Scan",     table: product,      expected: same, level: exact}
  - {a: "SmartScan",       b: "smartscan",      table: product,      expected: same, level: exact}

  # === alias-or-llm (SLM 判定が必要) ===
  - {a: "グローバルテック社", b: "Global Tech", table: organization, expected: same, level: alias-or-llm}

  # === different ===
  - {a: "山田 太郎",            b: "山田 花子",          table: person,       expected: different}
  - {a: "アクメ株式会社",       b: "ベータ製造株式会社", table: organization, expected: different}
  - {a: "グローバルテック社",   b: "ベータ製造株式会社", table: organization, expected: different}
  - {a: "IBM Bob Pro",          b: "IBM Bob Pro Plus",   table: product,      expected: different}
  - {a: "SmartScan",            b: "SmartView",          table: product,      expected: different}
