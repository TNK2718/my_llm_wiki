  # アドオン (将来の typed 化候補: product_addon)
  - {subject: "IBM Bob Premium Package for Java Modernization Individual", predicate: "アドオン対象", object: "IBM Bob Pro"}
  - {subject: "IBM Bob Premium Package for Java Modernization Individual", predicate: "アドオン対象", object: "IBM Bob Pro Plus"}
