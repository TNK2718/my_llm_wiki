# Typed-schema extract gold (i127-9285)。starter (person/organization/product/project/contract) 中心。
# 元の concept 型 entity と product-product "オファリング/アドオン対象" 関係は starter には無いため
# weak_relations に積む (将来の typed 化候補): アドオン / イネーブリング・ソフトウェア /
# 1000 RU パック・年単位計測 (Bob Enterprise 固有の販売単位は product 列で表現しきれない)。
# 月間使用量 / 無料評価版条件は product の typed 列 (billing_period / included_quota_units /
# quota_unit_name / trial_period_days, 0004 migration) に typed 化済み。
schema_version: 2
doc_slug: i127-9285
source: data/eval/sources/i127-9285.md

entities:
  - proposed_type: organization
    canonical_name: "IBM"
    attributes:
      org_type: company

  # Bob 製品ファミリ
  - proposed_type: product
    canonical_name: "IBM Bob"
    aliases: ["Bob"]
  - proposed_type: product
    canonical_name: "IBM Bob Pro"
    aliases: ["Bob Pro"]
    attributes:
      billing_period: monthly
      included_quota_units: 40
      quota_unit_name: "Bobcoin"
  - proposed_type: product
    canonical_name: "IBM Bob Pro Plus"
    aliases: ["Bob Pro Plus"]
    attributes:
      billing_period: monthly
      included_quota_units: 160
      quota_unit_name: "Bobcoin"
  - proposed_type: product
    canonical_name: "IBM Bob Ultra"
    aliases: ["Bob Ultra"]
    attributes:
      billing_period: monthly
      included_quota_units: 500
      quota_unit_name: "Bobcoin"
  - proposed_type: product
    canonical_name: "IBM Bob Enterprise"
    aliases: ["Bob Enterprise"]
    attributes:
      billing_period: annual
      included_quota_units: 1000
      quota_unit_name: "Bobcoin"
  - proposed_type: product
    canonical_name: "IBM Bob 無料評価版"
    aliases: ["Bob 無料評価版"]
    attributes:
      billing_period: one_time
      included_quota_units: 40
      quota_unit_name: "Bobcoin"
      trial_period_days: 30

  - proposed_type: product
    canonical_name: "IBM Bob Premium Package for Java Modernization Individual"
    aliases: ["Bob Premium Package for Java Modernization Individual"]
  - proposed_type: product
    canonical_name: "IBM Bob Premium Package for Java Modernization Enterprise"
    aliases: ["Bob Premium Package for Java Modernization Enterprise"]

  # 計測単位 (product として扱う妥当性は弱いが starter に課金単位の型は無いので
  # ここでは weak 経由のほうが筋。entity 化はしない)

  - proposed_type: product
    canonical_name: "IBM WebSphere"
  - proposed_type: product
    canonical_name: "IBM WebSphere Liberty"

  - proposed_type: product
    canonical_name: "Bob-Shell"
  - proposed_type: product
    canonical_name: "Bob IDE"

  # 本文書自体: サービス記述書 contract entity
  - proposed_type: contract
    canonical_name: "i127-9285"
    aliases: ["サービス記述書 i127-9285", "サービス記述書i127-9285", "本サービス記述書"]
    attributes:
      contract_type: service_description
  # 本文書から参照される外部契約
  - proposed_type: contract
    canonical_name: "クラウド・サービス契約"
    aliases: ["クラウドサービス契約書", "CSA", "Cloud Service Agreement"]
    attributes:
      contract_type: terms_of_service
      url: "http://www.ibm.com/terms/csa"
  - proposed_type: contract
    canonical_name: "データ処理補遺"
    aliases: ["DPA", "Data Processing Addendum"]
    attributes:
      contract_type: data_processing

