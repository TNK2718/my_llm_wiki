# Typed-schema extract gold (docs/typed-schema-design.md)。
# starter: person / organization / product / project / + employment / manufacturing / org_hierarchy
# 旧 generic facts/relations は廃止。属性は entity.attributes、非 starter 関係は weak_relations へ。
schema_version: 2
doc_slug: acme-overview
source: data/eval/sources/acme-overview.md

entities:
  - proposed_type: organization
    canonical_name: "アクメ株式会社"
    aliases: ["Acme Inc.", "アクメ"]
    attributes:
      org_type: company
      founded_year: 2015
      headquarters: "東京都港区"
  - proposed_type: person
    canonical_name: "山田 太郎"
    aliases: ["山田太郎"]
  - proposed_type: person
    canonical_name: "鈴木 花子"
    aliases: ["鈴木花子"]
  - proposed_type: product
    canonical_name: "SmartScan"
    aliases: ["Smart Scan"]
    attributes:
      category: "異常検知"
  - proposed_type: organization
    canonical_name: "グローバルテック社"
    aliases: ["グローバルテック"]
    attributes:
      org_type: company
      headquarters: "シンガポール"
  - proposed_type: organization
    canonical_name: "ベータ製造株式会社"
    aliases: ["ベータ製造"]
    attributes:
      org_type: company

relations:
  - proposed_junction: employment
    from: "山田 太郎"
    to: "アクメ株式会社"
    attributes: {role: "CEO"}
  - proposed_junction: employment
    from: "鈴木 花子"
    to: "アクメ株式会社"
    attributes: {role: "CTO"}
  - proposed_junction: manufacturing
    from: "SmartScan"
    to: "アクメ株式会社"
  - proposed_junction: org_hierarchy
    from: "グローバルテック社"
    to: "アクメ株式会社"   # parent → child

weak_relations:
  # 業務提携・共同推進は starter junction には無いので weak へ
  - subject: "アクメ株式会社"
    predicate: "業務提携"
    object: "ベータ製造株式会社"
  - subject: "アクメ株式会社"
    predicate: "共同推進"
    object: "ベータ製造株式会社"
