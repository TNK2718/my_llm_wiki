# Query evaluator のゴールド。fixture (data/eval/fixtures/<fixture>) を前提とする。
# fixture は同名 extract gold から決定的に build される（fixtures.build_fixture）。
#
# 設計方針: text2sql route を主に評価する。
# - query.py:find_entity_term は entities.canonical_name の "in question" 部分一致で
#   テンプレ経路を発火させる。したがって全 QA は canonical_name
#   (アクメ株式会社 / 山田 太郎 / 鈴木 花子 / SmartScan / グローバルテック社 /
#   ベータ製造株式会社) を含まないよう設計し、必ず text2sql に落とす。
# - alias (アクメ / Smart Scan / 山田太郎 等) は find_entity_term に走査されないため、
#   "アクメの…" のような短縮表記は安全に使える。
# - SLM 生成 SQL の列名は予測困難なので expected_row_contains は空に固定し、
#   主シグナルは route_accuracy と sql_success_rate にする。
# - expected_doc_slugs は FTS5 の日本語トークナイズ依存で不安定なため指定しない。
schema_version: 1
fixture: acme.sqlite
extract_gold: data/eval/gold/extract/acme-overview.yml

qa:
  # === scalar filter: 数値比較 (value は "120名" の文字列なので CAST or 桁抽出が必要) ===
  - q: "従業員数が100名以上の会社は？"
    expected_route: text2sql
    expected_row_contains: []

  # === scalar filter: 文字列部分一致 (value LIKE '%東京%') ===
  - q: "本社が東京都にある会社を教えて"
    expected_route: text2sql
    expected_row_contains: []

  # === predicate filter: 述語が "親会社" の relation を列挙 ===
  - q: "親会社を持つ組織は？"
    expected_route: text2sql
    expected_row_contains: []

  # === predicate filter (双方向 join): 業務提携の subject/object ペア ===
  - q: "業務提携している組織のペアは？"
    expected_route: text2sql
    expected_row_contains: []

  # === aggregation: COUNT(*) WHERE type='person' ===
  - q: "登録されている人物は何名？"
    expected_route: text2sql
    expected_row_contains: []

  # === aggregation: DISTINCT 値の列挙 ===
  - q: "登録されている本社所在地の一覧は？"
    expected_route: text2sql
    expected_row_contains: []

  # === alias 解決: entity は alias 表記 (アクメ) のみで言及。
  #     find_entity_term は alias を走査しないのでテンプレに落ちず、
  #     text2sql 側で entity_aliases LIKE か canonical_name LIKE が必要。
  - q: "アクメの主力製品は？"
    expected_route: text2sql
    expected_row_contains: []

  # === NOT EXISTS / 反転: subject に "親会社" relation を持たない組織 ===
  - q: "親会社を持たない組織は？"
    expected_route: text2sql
    expected_row_contains: []
