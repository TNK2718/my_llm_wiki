# Typed-schema query gold (docs/typed-schema-design.md §8 linter 準拠)。
#   - range/比較 predicate は canonical 表 (person.birth_date, organization.founded_year 等) にのみ
#   - claims を引くときは status フィルタ必須
#   - LIKE wildcard は canonical_name/alias のみ (claims.value には不可)
schema_version: 2
fixture: acme.sqlite
extract_gold: data/eval/gold/extract/acme-overview.yml

qa:
  # === employment 経由 (CEO は誰) ===
  - q: "アクメ株式会社の CEO は誰？"
    expected_row_contains:
      - {value: "山田"}

  # === employment 経由 (Acme alias 解決) ===
  - q: "アクメの CTO は誰？"
    expected_row_contains:
      - {value: "鈴木"}

  # === manufacturing (主力製品の製造元) ===
  - q: "SmartScan を作っているのは？"
    expected_row_contains:
      - {value: "アクメ"}

  # === organization canonical 列 range/比較 ===
  - q: "本社が東京都にある会社は？"
    expected_row_contains:
      - {value: "アクメ"}

  - q: "2015 年以降に設立された会社は？"
    expected_row_contains:
      - {value: "アクメ"}

  # === org_hierarchy ===
  - q: "アクメ株式会社の親会社は？"
    expected_row_contains:
      - {value: "グローバルテック"}

  # === count ===
  - q: "登録されている person の数は？"
    expected_row_contains: []

  # === claims 履歴 (linter R2 例) ===
  - q: "山田 太郎の役職の履歴は？"
    expected_row_contains:
      - {value: "CEO"}

schema_proposals:
  # 「業務提携」「共同推進」は weak_relations に積まれ、N>=5 で proposal 化される想定。
  # この単一文書では閾値に満たないので proposal 期待値は無し。
  expected: []
